# Windows release build for OwLLM Desktop on GitHub Actions.
#
# WHY this exists: the local i9-13900KF has degraded under the Raptor
# Lake Vmin-shift issue (WHEA-Logger ID 19 — TLB error on APIC 32),
# causing rustc to crash with STATUS_HEAP_CORRUPTION on any non-trivial
# build. This workflow runs the same build on a clean Microsoft-hosted
# Windows runner with healthy hardware + the MSVC toolchain (faster +
# more stable than mingw on Windows).
#
# TRIGGER: manual only (workflow_dispatch). You click "Run workflow"
# in the Actions tab on github.com when you want a fresh exe. Avoids
# burning the 2,000-min/month free quota on builds you don't need.
#
# OUTPUT: two artifacts attached to the run:
#   1. "OwLLM Desktop.exe"       — portable, double-clickable
#   2. "OwLLM Desktop Setup.exe" — NSIS installer
# Download from the workflow run's Summary page. ~30 MB each.

name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to mark this build (shows on the run title)"
        required: false
        default: ""

jobs:
  windows-release:
    name: Build Windows MSVC exe
    runs-on: windows-latest
    # ~15 min cold cache, ~5 min warm. Plenty of headroom over both.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: owllm-desktop/package-lock.json

      - name: Set up Rust (MSVC) + cargo cache
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: owllm-desktop/src-tauri
          # Tag cache by the manifest's Cargo.lock + the workflow file
          # so a dep bump or workflow tweak naturally invalidates.
          shared-key: owllm-desktop-msvc

      - name: Install UI deps
        working-directory: owllm-desktop
        run: npm ci

      - name: Build the Vite UI (TypeScript → dist/)
        working-directory: owllm-desktop
        run: npm run build

      - name: Build Tauri release (MSVC)
        working-directory: owllm-desktop
        # `npm run tauri` forwards args to the tauri CLI. The
        # x86_64-pc-windows-msvc target uses the MSVC toolchain that's
        # pre-installed on windows-latest runners — no mingw, no gcc,
        # no IRA ICE on sqlite3.c. The NSIS bundle drops the installer
        # next to the portable exe.
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Stage release artifacts
        working-directory: owllm-desktop
        shell: pwsh
        run: |
          $rel = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $bundle = "$rel\bundle\nsis"
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item "$rel\owllm-desktop.exe" "stage\OwLLM Desktop.exe" -Force
          # Tauri's NSIS bundle name includes the version; grab whatever
          # x64-setup .exe lands in the bundle dir so a version bump
          # doesn't break the workflow.
          $setup = Get-ChildItem -Path $bundle -Filter "*x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "stage\OwLLM Desktop Setup.exe" -Force }
          # WebView2Loader.dll must sit next to the portable exe (same
          # rule as the local build-release.bat).
          if (Test-Path "$rel\WebView2Loader.dll") {
            Copy-Item "$rel\WebView2Loader.dll" "stage\WebView2Loader.dll" -Force
          }
          Get-ChildItem stage | Format-Table Name,Length,LastWriteTime

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-portable
          path: owllm-desktop/stage/OwLLM Desktop.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-installer
          path: owllm-desktop/stage/OwLLM Desktop Setup.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload WebView2Loader.dll
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-webview2loader
          path: owllm-desktop/stage/WebView2Loader.dll
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Parallel GNU/mingw build — A/B test against MSVC to find out whether the
  # 1-second WebView2 white-flash on cold start is a property of the MSVC
  # toolchain (different process-startup + DLL-load profile, unsigned-exe
  # SmartScreen pause) or something else entirely. The user reported pre-MSVC
  # GNU builds were sub-1s to usable; this job rebuilds the same source under
  # GNU on a healthy CI runner so the toolchains can be compared apples-to-
  # apples, without the local i9-13900KF TLB-error noise.
  # ---------------------------------------------------------------------------
  windows-release-gnu:
    name: Build Windows GNU/mingw exe (A/B comparison)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: owllm-desktop/package-lock.json

      - name: Set up Rust (GNU) + cargo cache
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: owllm-desktop/src-tauri
          shared-key: owllm-desktop-gnu

      # windows-latest has mingw-w64 in multiple places (C:\mingw64,
      # Strawberry Perl's bundle, msys64 sometimes). Discover gcc + windres
      # paths and set GitHub env so subsequent steps use them. Tolerant of
      # different file-naming conventions (some distros ship windres.exe
      # without the cross-prefix).
      - name: Discover mingw-w64 toolchain
        shell: pwsh
        run: |
          $bins = @(
            "C:\mingw64\bin",
            "C:\Strawberry\c\bin",
            "C:\msys64\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          ) | Where-Object { Test-Path $_ }

          $gcc     = $null
          $windres = $null
          foreach ($b in $bins) {
            if (-not $gcc) {
              foreach ($n in 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe') {
                $p = Join-Path $b $n
                if (Test-Path $p) { $gcc = $p; break }
              }
            }
            if (-not $windres) {
              foreach ($n in 'x86_64-w64-mingw32-windres.exe', 'windres.exe') {
                $p = Join-Path $b $n
                if (Test-Path $p) { $windres = $p; break }
              }
            }
          }

          if (-not $gcc)     { throw "x86_64-w64-mingw32-gcc not found in any candidate path" }
          if (-not $windres) { throw "windres not found in any candidate path" }

          "Found gcc:     $gcc"     | Out-Host
          "Found windres: $windres" | Out-Host

          # Prepend mingw bin to PATH so cargo can find the linker.
          (Split-Path $gcc) >> $env:GITHUB_PATH

          # Tell winresource / cc-rs to use the GNU toolchain end-to-end
          # (otherwise winresource picks MSVC rc.exe, which produces a
          # resource.lib mingw ld can't read — "file format not recognized").
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc"   >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_gnu=$gcc"                    >> $env:GITHUB_ENV
          "AR_x86_64_pc_windows_gnu=$(Join-Path (Split-Path $gcc) 'ar.exe')" >> $env:GITHUB_ENV
          "WINDRES_x86_64_pc_windows_gnu=$windres"           >> $env:GITHUB_ENV
          "RC=$windres"                                      >> $env:GITHUB_ENV
          "WINDRES=$windres"                                 >> $env:GITHUB_ENV

      - name: Install UI deps
        working-directory: owllm-desktop
        run: npm ci

      - name: Build the Vite UI (TypeScript → dist/)
        working-directory: owllm-desktop
        run: npm run build

      - name: Build Tauri release (GNU)
        working-directory: owllm-desktop
        # Cargo defaults apply (no [profile.release] override anymore).
        # The CFLAGS=-O1 workaround for the local gcc 13.2 IRA ICE on
        # sqlite3.c is NOT applied here — CI mingw is a different version
        # and shouldn't hit that bug. If it does, we'll add it back.
        run: npm run tauri -- build --target x86_64-pc-windows-gnu

      - name: Stage GNU release artifacts
        working-directory: owllm-desktop
        shell: pwsh
        run: |
          $rel = "src-tauri\target\x86_64-pc-windows-gnu\release"
          $bundle = "$rel\bundle\nsis"
          New-Item -ItemType Directory -Force -Path "stage-gnu" | Out-Null
          Copy-Item "$rel\owllm-desktop.exe" "stage-gnu\OwLLM Desktop (GNU).exe" -Force
          $setup = Get-ChildItem -Path $bundle -Filter "*x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "stage-gnu\OwLLM Desktop Setup (GNU).exe" -Force }
          if (Test-Path "$rel\WebView2Loader.dll") {
            Copy-Item "$rel\WebView2Loader.dll" "stage-gnu\WebView2Loader.dll" -Force
          }
          Get-ChildItem stage-gnu | Format-Table Name,Length,LastWriteTime

      - name: Upload GNU portable exe
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-portable-gnu
          path: owllm-desktop/stage-gnu/OwLLM Desktop (GNU).exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload GNU NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-installer-gnu
          path: owllm-desktop/stage-gnu/OwLLM Desktop Setup (GNU).exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload GNU WebView2Loader.dll
        uses: actions/upload-artifact@v4
        with:
          name: OwLLM-Desktop-webview2loader-gnu
          path: owllm-desktop/stage-gnu/WebView2Loader.dll
          if-no-files-found: warn
          retention-days: 30
