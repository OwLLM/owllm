name: Release modules

# Build the module ZIPs (bootstrap.bat), publish them to a GitHub Release,
# and patch data/modules/registry.json with the real SHA-256 hashes and
# release download URLs. Trigger on a tag like `modules-2026.06.10`.
#
# Workflow:
#   1. git tag modules-2026.06.10 && git push --tags
#   2. This workflow runs:
#      - checks out the repo
#      - installs pwsh (already on windows-latest)
#      - runs scripts\build-modules.ps1 (with optional -Skip finetune-* to
#        keep runtime under the 6-hour GH Actions cap; finetune wheelhouses
#        are huge and best built locally)
#      - creates a Release with the ZIPs attached
#      - opens a PR updating data/modules/registry.json with the new hashes
#        + URLs (so it lands via review, not silent merge)
#
# After the workflow completes:
#   - Review/merge the auto-PR → registry update lands on main
#   - Installed apps fetch the new registry on next launch, see updates,
#     download new module versions automatically

on:
  push:
    tags:
      - "modules-*"
  workflow_dispatch:
    inputs:
      skip_pattern:
        description: "Skip pattern for build-modules.ps1 (e.g. finetune-*)"
        required: false
        default: "finetune-*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIPs
        shell: pwsh
        run: |
          $skip = if ("${{ github.event.inputs.skip_pattern }}" -ne "") {
            "${{ github.event.inputs.skip_pattern }}"
          } else {
            "finetune-*"
          }
          ./owllm-desktop/scripts/build-modules.ps1 -Skip $skip

      - name: Upload built ZIPs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zips
          path: owllm-desktop/dist/modules/*.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Module ZIPs for OwLLM Desktop.

            Built by `.github/workflows/release-modules.yml` from `bootstrap-manifest.json`.
            SHA-256 hashes for each ZIP are in the matching `*.sha256` file alongside.

            **Consumer of these artifacts:** the ModuleManager in the desktop app,
            which reads `data/modules/registry.json` (also updated by this workflow's
            auto-PR) to know which version + URL + hash to fetch.
          files: |
            owllm-desktop/dist/modules/*.zip
            owllm-desktop/dist/modules/*.sha256
            owllm-desktop/dist/modules/manifest.json

      - name: Patch registry.json with new hashes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $registryPath = "data/modules/registry.json"
          $manifest = Get-Content "owllm-desktop/dist/modules/manifest.json" -Raw | ConvertFrom-Json
          $registry = Get-Content $registryPath -Raw | ConvertFrom-Json
          foreach ($built in $manifest.modules) {
            foreach ($mod in $registry.modules) {
              foreach ($v in $mod.variants) {
                if ($v.id -eq $built.variant) {
                  $v.sizeBytes = $built.sizeBytes
                  foreach ($channelName in $v.channels.PSObject.Properties.Name) {
                    $rel = $v.channels.$channelName
                    $rel.sha256 = $built.sha256
                    $rel.downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($built.variant).zip"
                  }
                }
              }
            }
          }
          $registry.registryVersion = $tag.Replace("modules-", "")
          $registry.publishedAt = (Get-Date -Format "o")
          $registry | ConvertTo-Json -Depth 12 | Set-Content $registryPath
          Write-Host "Patched $registryPath:"
          Get-Content $registryPath

      - name: Open registry update PR
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "registry: hashes + URLs for ${{ github.ref_name }}"
          title: "registry: update for ${{ github.ref_name }}"
          body: |
            Auto-generated by `.github/workflows/release-modules.yml` after
            tag `${{ github.ref_name }}` shipped its module ZIPs to a Release.

            **What changed:**
            - SHA-256 hashes for each variant updated to the freshly built ZIPs
            - `downloadUrl` pointed at the new release tag
            - `registryVersion` + `publishedAt` bumped

            Merging this PR makes the new module versions visible to every
            installed app on next launch (registry is pulled from `main`).
          branch: registry-update-${{ github.ref_name }}
          add-paths: data/modules/registry.json
