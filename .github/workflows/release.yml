# Cross-platform release build for OwLLM Desktop.
#
# Trigger:
#   * Manual `workflow_dispatch` ONLY → builds Windows + macOS + Linux and
#                                     publishes a GitHub Release with every
#                                     installer attached. Tag pushes do NOT
#                                     fire this workflow: the real releases are
#                                     built locally (see the `on:` block below).
#
# Output formats per platform (matches the bundle.targets = "all" in
# src-tauri/tauri.conf.json):
#   * Windows  — *.exe NSIS installer  +  portable owllm-desktop.exe
#   * macOS    — *.dmg drag-installer  +  *.app bundle (arm64 / Apple Silicon)
#   * Linux    — *.deb (Debian/Ubuntu) + *.rpm (Fedora/RHEL) + *.AppImage (universal)
#
# Code signing: every signing env var is OPTIONAL. When the corresponding
# secret is unset the build still succeeds; the artefact is just unsigned
# (Windows SmartScreen / macOS Gatekeeper will warn end-users). To turn
# on signing, add these repository secrets in GitHub Settings → Secrets:
#
#   Windows (Authenticode):
#     WINDOWS_CERTIFICATE                 — .pfx base64-encoded
#     WINDOWS_CERTIFICATE_PASSWORD        — passphrase
#
#   macOS (Developer ID + notarisation):
#     APPLE_CERTIFICATE                   — .p12 base64-encoded
#     APPLE_CERTIFICATE_PASSWORD          — passphrase
#     APPLE_SIGNING_IDENTITY              — "Developer ID Application: <name> (<team>)"
#     APPLE_ID                            — apple-id email
#     APPLE_PASSWORD                      — app-specific password
#     APPLE_TEAM_ID                       — 10-char team id
#
#   Auto-updater (Tauri signing, all platforms):
#     TAURI_SIGNING_PRIVATE_KEY           — generated via `tauri signer generate`
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — passphrase
#
#   Cross-repo publishing (REQUIRED — release fails without it):
#     PUBLIC_REPO_TOKEN                   — Personal Access Token with `repo` scope
#                                           on OwLLM/owllm. Used by the release
#                                           step to upload installers cross-repo
#                                           into the public distribution repo.
#                                           Create at github.com/settings/tokens.
#                                           This is NOT the default GITHUB_TOKEN
#                                           because that one is scoped to this
#                                           private source repo only.

name: Release

on:
  # NOTE: deliberately NOT triggered by tag pushes. Releases are built on the
  # local machines (Windows host + WSL x86_64 + THOR aarch64 + the paired Mac)
  # because only the host can Authenticode-sign with the Certum EV cert and
  # only the host holds the minisign updater key. A tag push used to fire this
  # workflow too, producing an unsigned parallel build (and a billing failure).
  # Run it by hand from the Actions tab if a local builder is unavailable.
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (e.g. v0.1.1). Leave blank to use the value baked into tauri.conf.json.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Cancel any in-flight release for the same ref so a quick re-tag
# doesn't waste minutes on a stale build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed by the release job to create/update a GitHub Release

jobs:
  # ---------------------------------------------------------------------
  # Build matrix — every platform runs in parallel. fail-fast: false so a
  # single platform failure doesn't cancel the others and you can still
  # ship the working installers while you triage.
  # ---------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Fresh Linux runners can spend more than 45 minutes in the optimized
    # Rust/Tauri link. Keep a hard bound, but leave enough time for both Linux
    # architectures to reach packaging instead of cancelling healthy builds.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Windows x64'
            os: 'windows-latest'
            rust_target: 'x86_64-pc-windows-msvc'
            tauri_args: '--target x86_64-pc-windows-msvc'
            artifact: 'owllm-desktop-windows-x64'
            updater_platform: 'windows-x86_64'
            updater_pattern: '*-setup.exe'
            updater_asset: 'OwLLM.Desktop.Setup.exe'
          # ONE universal bundle serves both Apple architectures, so both
          # darwin-* updater keys point at it. Building a single-arch mac binary
          # is what stranded every Intel Mac with no updater entry at all.
          - label: 'macOS universal'
            os: 'macos-latest'
            rust_target: 'universal-apple-darwin'
            extra_rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin'
            artifact: 'owllm-desktop-macos-universal'
            updater_platform: 'darwin-aarch64 darwin-x86_64'
            updater_pattern: '*.app.tar.gz'
            updater_asset: 'OwLLM.Desktop_universal.app.tar.gz'
          # NOTE: the 'macOS Intel' (macos-13 / x86_64-apple-darwin) entry was
          # removed 2026-07: GitHub retired the macos-13 runner image, so the
          # job queued forever and blocked every release. Intel is now covered by
          # the universal bundle above rather than by its own runner.
          - label: 'Linux x64'
            os: 'ubuntu-22.04'
            rust_target: 'x86_64-unknown-linux-gnu'
            # --target must match rust_target: the "Stage installers" and
            # smoke-test steps derive the bundle dir from rust_target, and
            # without an explicit --target Tauri writes to target/release/
            # instead — the path mismatch made every Linux release fail at
            # the staging step despite a successful build.
            tauri_args: '--target x86_64-unknown-linux-gnu'
            artifact: 'owllm-desktop-linux-x64'
            updater_platform: 'linux-x86_64'
            updater_pattern: '*.AppImage'
            updater_asset: 'OwLLM.Desktop_amd64.AppImage'
          - label: 'Linux ARM64'
            os: 'ubuntu-24.04-arm'
            rust_target: 'aarch64-unknown-linux-gnu'
            tauri_args: '--target aarch64-unknown-linux-gnu'
            artifact: 'owllm-desktop-linux-arm64'
            updater_platform: 'linux-aarch64'
            updater_pattern: '*.AppImage'
            updater_asset: 'OwLLM.Desktop_aarch64.AppImage'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: owllm-desktop/package-lock.json

      # universal-apple-darwin is a tauri lipo target, not a rustup one: install
      # the two real slices it is built from instead.
      - name: Set up Rust + ${{ matrix.rust_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_rust_targets || matrix.rust_target }}

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: owllm-desktop/src-tauri
          shared-key: tauri-${{ matrix.rust_target }}

      # ---------------------------------------------------------------
      # Linux system deps. Tauri 2 needs webkit2gtk-4.1, gtk-3 dev headers,
      # appindicator, librsvg, patchelf (for AppImage relocation), and
      # libssl-dev/pkg-config for reqwest's transitive deps. ubuntu-22.04
      # has webkit2gtk-4.1 in the default repos and a glibc old enough
      # that the resulting .deb/.AppImage runs on Debian 12, Ubuntu 22.04+,
      # and Fedora 38+.
      # ---------------------------------------------------------------
      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            rpm

      # ---------------------------------------------------------------
      # Optional signing — these steps are no-ops when their guarding
      # secret isn't set. Keeps the matrix unconditional and lets the
      # repo build unsigned for fast iteration, then flip on signing
      # by adding the secret in repo settings.
      # ---------------------------------------------------------------
      - name: Import macOS signing certificate
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode the base64 .p12 and import into a temp keychain so the
          # cert isn't left behind on the runner.
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Install UI dependencies
        working-directory: owllm-desktop
        run: npm ci

      - name: Verify updater manifest generation
        working-directory: owllm-desktop
        run: node scripts/generate-updater-manifest.verify.run.mjs

      - name: Verify every regression harness in the repo
        working-directory: owllm-desktop
        run: npm run test:all

      - name: Build the Vite UI
        working-directory: owllm-desktop
        run: npm run build

      # ---------------------------------------------------------------
      # Bundle the whisper.cpp voice runtime into resources/runtime/
      # so installed users don't have to click "Install voice runtime"
      # on the Accounts page — the binary + model travel inside the
      # installer.
      #
      #   * Windows: upstream ships a prebuilt zip with main.exe and
      #     supporting DLLs. Unpack into resources/runtime/whisper.cpp/.
      #   * macOS / Linux: no upstream prebuilts → build from source via
      #     cmake. Produces bin/whisper-cli (and main on older tags) in
      #     the build tree; we copy that one binary into the resources
      #     dir, no DLLs needed.
      #   * Model file (ggml-base.bin, ~142 MB) is platform-neutral and
      #     downloaded from huggingface for every runner. Installer size
      #     grows by ~150 MB but first-run voice transcription Just Works
      #     offline.
      #
      # If the asset URL ever 404s (e.g. ggerganov → ggml-org rename
      # round 2), the build fails fast here — better than shipping a
      # silently-broken voice runtime.
      # ---------------------------------------------------------------
      - name: Bundle whisper.cpp voice runtime
        shell: bash
        working-directory: owllm-desktop
        env:
          WHISPER_TAG: 'v1.8.4'
          WHISPER_MODEL_URL: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin'
        run: |
          set -euo pipefail
          DEST="resources/runtime/whisper.cpp"
          mkdir -p "$DEST"
          rm -f "$DEST/.gitkeep"

          echo "Downloading ggml-base.bin (~142 MB)..."
          curl -fL --retry 3 -o "$DEST/ggml-base.bin" "$WHISPER_MODEL_URL"

          case "${{ matrix.os }}" in
            windows-*)
              ZIP="https://github.com/ggml-org/whisper.cpp/releases/download/${WHISPER_TAG}/whisper-bin-x64.zip"
              echo "Downloading Windows whisper.cpp bundle from $ZIP"
              curl -fL --retry 3 -o /tmp/whisper-bin.zip "$ZIP"
              # `unzip` is available on windows-latest (via Git for Windows).
              unzip -q -o /tmp/whisper-bin.zip -d /tmp/whisper-bin-unpacked
              # The zip nests a `Release/` folder containing main.exe + DLLs.
              # Flatten it so resources/runtime/whisper.cpp/main.exe is the
              # path find_whisper_cli() picks up first.
              find /tmp/whisper-bin-unpacked -name '*.exe' -exec cp {} "$DEST/" \;
              find /tmp/whisper-bin-unpacked -name '*.dll' -exec cp {} "$DEST/" \;
              rm -f /tmp/whisper-bin.zip
              rm -rf /tmp/whisper-bin-unpacked
              ;;
            macos-*|ubuntu-*)
              echo "Building whisper.cpp ${WHISPER_TAG} from source..."
              git clone --depth 1 -b "$WHISPER_TAG" \
                https://github.com/ggml-org/whisper.cpp /tmp/whisper-src
              cmake -S /tmp/whisper-src -B /tmp/whisper-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DWHISPER_BUILD_TESTS=OFF \
                -DWHISPER_BUILD_SERVER=OFF \
                -DWHISPER_BUILD_EXAMPLES=ON
              cmake --build /tmp/whisper-build --config Release -j 4
              # 1.8.x renamed `main` → `whisper-cli`. Copy whichever the
              # build produced (or both, if a transitional tag has both).
              find /tmp/whisper-build -type f \( -name 'whisper-cli' -o -name 'main' \) \
                -exec cp {} "$DEST/" \;
              chmod +x "$DEST"/whisper-cli "$DEST"/main 2>/dev/null || true
              rm -rf /tmp/whisper-src /tmp/whisper-build
              ;;
          esac

          echo "Bundled voice runtime:"
          ls -lh "$DEST"

      # Tauri seals the .app but never re-signs binaries it merely COPIES out of
      # resources/. whisper.cpp is compiled by the step above, so it lands
      # ad-hoc-signed with no hardened runtime and no secure timestamp, and
      # notarisation rejects the whole archive ("The binary is not signed with a
      # valid Developer ID certificate"). That is why every macOS DMG we have
      # shipped is signed but NOT notarised, so Gatekeeper refuses to open it.
      # Sign every nested Mach-O before the bundler runs.
      - name: Sign nested macOS binaries (hardened runtime + timestamp)
        if: startsWith(matrix.os, 'macos') && env.APPLE_SIGNING_IDENTITY != ''
        working-directory: owllm-desktop
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          signed=0
          while IFS= read -r f; do
            file "$f" | grep -q 'Mach-O' || continue
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$f"
            echo "  signed: $f"
            signed=$((signed + 1))
          done < <(find resources -type f)
          echo "nested Mach-O signed: $signed"

      # ---------------------------------------------------------------
      # The actual Tauri build. Signing env vars are passed through
      # unconditionally — tauri-cli ignores empty values. The runner's
      # CARGO_PROFILE_RELEASE_LTO=thin matches our local
      # build-release.bat output so debug/release parity stays clean.
      # ---------------------------------------------------------------
      - name: Build Tauri (${{ matrix.label }})
        working-directory: owllm-desktop
        # bash on ALL three OSes so the inline --config JSON below quotes
        # identically (PowerShell mangles the escaped quotes). GitHub's
        # windows runner has bash + the MSVC toolchain on the system PATH,
        # so the Windows build is unaffected.
        shell: bash
        env:
          # Tauri auto-updater signing (cross-platform).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing identity + notarisation.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode.
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        # --config forces createUpdaterArtifacts=true for the CI build ONLY,
        # so tauri emits the signed .sig + latest.json the updater needs. The
        # committed tauri.conf.json keeps it false so local key-less builds
        # (build-release.bat) still work without a signing key. Requires the
        # TAURI_SIGNING_PRIVATE_KEY secret to be set, or this build fails.
        run: |
          # An UNSET repo secret still materialises here as a SET-but-EMPTY
          # env var, and tauri-cli does NOT ignore empty values for the
          # Apple vars: an empty APPLE_SIGNING_IDENTITY makes it attempt
          # `codesign` with identity "" and the whole build fails with
          # "The specified item could not be found in the keychain".
          # Unset every empty signing var so missing secrets mean
          # "build unsigned", as the header comment promises.
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                   TAURI_WINDOWS_CERTIFICATE TAURI_WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -z "$(eval echo "\${$v:-}")" ]; then unset "$v"; fi
          done
          # certificateThumbprint:null REMOVES tauri.conf.json's EV thumbprint for CI
          # (--config uses JSON merge-patch: null deletes the key, but "" keeps it
          # set and makes Tauri run signtool with no cert — that broke v0.7.33).
          # The SimplySign/Certum cert lives only on the host, so CI builds unsigned;
          # signed releases come from the host publish path, which HAS the cert.
          # Tauri downloads platform bundlers (for example WiX on Windows) on
          # first use. Retry the complete command so a transient CDN reset does
          # not discard an otherwise successful 20+ minute native build; Cargo
          # reuses the completed target on subsequent attempts.
          TAURI_BUILD_MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$TAURI_BUILD_MAX_ATTEMPTS"); do
            if npm run tauri -- build ${{ matrix.tauri_args }} --config '{"bundle":{"createUpdaterArtifacts":true,"windows":{"certificateThumbprint":null}}}'; then
              break
            fi
            if [ "$attempt" -eq "$TAURI_BUILD_MAX_ATTEMPTS" ]; then
              echo "Tauri packaging failed after $TAURI_BUILD_MAX_ATTEMPTS attempts" >&2
              exit 1
            fi
            echo "Tauri build attempt $attempt failed; retrying in 15 seconds..." >&2
            sleep 15
          done

      # ---------------------------------------------------------------
      # Smoke test — launch the built binary and verify it stays alive
      # for 8 seconds. Catches: missing dylibs / shared libraries, panics
      # in setup hooks, codesign refusals, Gatekeeper rejection, malformed
      # binaries (compiled but immediately crashes). Cheap (~10s) and
      # runs on every build. Doesn't validate anything past the first
      # frame; that needs human eyes on a real machine.
      # ---------------------------------------------------------------
      - name: Smoke test — launch binary
        working-directory: owllm-desktop
        shell: bash
        # continue-on-error so a smoke failure shows as a warning but
        # doesn't stop the release publish — you can still inspect the
        # installer manually. Flip to false once smoke tests are
        # stable to fail the release on regressions.
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -n "${{ matrix.rust_target }}" ]; then
            rel_dir="src-tauri/target/${{ matrix.rust_target }}/release"
          else
            rel_dir="src-tauri/target/release"
          fi
          case "${{ runner.os }}" in
            Windows)
              # Windows runners have no console GUI session by default, so
              # spawning the windowed exe is tricky — we instead do static
              # validation: PE header parses, expected sections are present.
              exe="$rel_dir/owllm-desktop.exe"
              if [ ! -f "$exe" ]; then
                echo "::error::Windows exe not found at $exe"; exit 1
              fi
              # `file` is part of Git for Windows / windows-latest runners.
              if file "$exe" | grep -qE 'PE32(\+)?'; then
                echo "[smoke] ✓ $exe is a valid PE binary ($(stat -c%s "$exe" 2>/dev/null || wc -c < "$exe") bytes)"
              else
                echo "::error::$exe is not a valid PE binary"; exit 1
              fi
              ;;
            macOS)
              app=$(find "$rel_dir/bundle/macos" -maxdepth 2 -type d -name '*.app' | head -1)
              if [ -z "$app" ]; then
                echo "::error::no .app bundle found under $rel_dir/bundle/macos"; exit 1
              fi
              echo "[smoke] launching $app"
              open "$app"
              sleep 8
              if pgrep -f "owllm-desktop|OwLLM Desktop" > /dev/null; then
                echo "[smoke] ✓ macOS app alive after 8s"
                pkill -f "owllm-desktop|OwLLM Desktop" 2>/dev/null || true
              else
                echo "::error::macOS app died within 8s of launch"
                # Surface recent crash logs if present (best effort).
                log show --last 1m --predicate 'process contains "owllm-desktop"' 2>/dev/null | tail -50 || true
                ls -la "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -10 || true
                exit 1
              fi
              ;;
            Linux)
              # Linux runners are headless. Start xvfb so the Tauri webview
              # has a display to draw on; dbus is needed for webkit2gtk to
              # come up cleanly. Both are pre-installed on ubuntu-22.04.
              sudo apt-get install -y -qq xvfb dbus-x11 || true
              export DISPLAY=:99
              Xvfb :99 -screen 0 1024x768x24 &
              xvfb_pid=$!
              # dbus-launch sets DBUS_SESSION_BUS_ADDRESS so GTK/webkit can
              # connect to a session bus; without it the webview hangs.
              eval "$(dbus-launch --sh-syntax)"
              sleep 2
              bin="$rel_dir/owllm-desktop"
              if [ ! -x "$bin" ]; then
                echo "::error::Linux binary not found or not executable at $bin"; kill $xvfb_pid 2>/dev/null || true; exit 1
              fi
              echo "[smoke] launching $bin under Xvfb"
              "$bin" > /tmp/owllm-stdout.log 2> /tmp/owllm-stderr.log &
              app_pid=$!
              sleep 8
              if kill -0 $app_pid 2>/dev/null; then
                echo "[smoke] ✓ Linux binary alive after 8s"
                kill $app_pid 2>/dev/null || true
              else
                echo "::error::Linux binary died within 8s of launch"
                echo "--- stdout ---"; cat /tmp/owllm-stdout.log || true
                echo "--- stderr ---"; cat /tmp/owllm-stderr.log || true
                kill $xvfb_pid 2>/dev/null || true
                exit 1
              fi
              kill $xvfb_pid 2>/dev/null || true
              ;;
          esac

      # ---------------------------------------------------------------
      # Stage installers from the per-target bundle dir into a single
      # `stage/` folder. We grab every recognised installer extension so
      # this stays robust as bundle.targets="all" evolves (or as Tauri
      # adds new formats like flatpak).
      # ---------------------------------------------------------------
      - name: Stage installers
        working-directory: owllm-desktop
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.rust_target }}" ]; then
            rel_dir="src-tauri/target/${{ matrix.rust_target }}/release"
          else
            rel_dir="src-tauri/target/release"
          fi
          bundle_dir="$rel_dir/bundle"
          mkdir -p stage
          if [ ! -d "$bundle_dir" ]; then
            echo "No bundle directory at $bundle_dir — Tauri build produced no installers." >&2
            exit 1
          fi
          # Copy every installer artefact. NSIS bundles end in *-setup.exe;
          # we keep that pattern, plus every other common platform extension.
          find "$bundle_dir" -type f \( \
              -iname '*-setup.exe' \
              -o -iname '*.msi' \
              -o -iname '*.dmg' \
              -o -iname '*.app.tar.gz' \
              -o -iname '*.deb' \
              -o -iname '*.rpm' \
              -o -iname '*.AppImage' \
              -o -iname '*.AppImage.tar.gz' \
              -o -iname 'latest.json' \
              -o -iname '*.sig' \
            \) -exec cp {} stage/ \;
          # Tauri 2 creates the signed updater package and its .sig file, but
          # does not create latest.json. Select the updater package for this
          # matrix leg, give it a stable public filename, and generate the
          # target-qualified manifest consumed by the release job.
          updater_source=$(find stage -maxdepth 1 -type f -name '${{ matrix.updater_pattern }}' -print -quit)
          if [ -z "$updater_source" ] || [ ! -f "$updater_source.sig" ]; then
            echo "Signed updater package not found for ${{ matrix.updater_platform }}" >&2
            exit 1
          fi
          updater_target="stage/${{ matrix.updater_asset }}"
          updater_signature="$updater_target.sig"
          if [ "$updater_source" != "$updater_target" ]; then
            mv "$updater_source" "$updater_target"
          fi
          if [ "$updater_source.sig" != "$updater_signature" ]; then
            mv "$updater_source.sig" "$updater_signature"
          fi

          # Stable human-download names used by INSTALL_LINUX.md. Keep the
          # signed updater asset target-qualified; these copies exist only so
          # a person can choose distro + architecture without opening the raw
          # GitHub asset list or understanding versioned build filenames.
          case '${{ matrix.rust_target }}' in
            x86_64-unknown-linux-gnu)
              cp "$updater_target" stage/OwLLM.Desktop.AppImage
              deb=$(find stage -maxdepth 1 -type f -name '*.deb' -print -quit)
              rpm=$(find stage -maxdepth 1 -type f -name '*.rpm' -print -quit)
              [ -z "$deb" ] || cp "$deb" stage/OwLLM.Desktop.deb
              [ -z "$rpm" ] || cp "$rpm" stage/OwLLM.Desktop.x86_64.rpm
              ;;
            aarch64-unknown-linux-gnu)
              cp "$updater_target" stage/OwLLM.Desktop.aarch64.AppImage
              deb=$(find stage -maxdepth 1 -type f -name '*.deb' -print -quit)
              rpm=$(find stage -maxdepth 1 -type f -name '*.rpm' -print -quit)
              [ -z "$deb" ] || cp "$deb" stage/OwLLM.Desktop.arm64.deb
              [ -z "$rpm" ] || cp "$rpm" stage/OwLLM.Desktop.aarch64.rpm
              ;;
          esac

          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            release_tag='${{ github.event.inputs.version }}'
            if [ -z "$release_tag" ]; then release_tag="v$version"; fi
          fi
          UPDATER_VERSION="$version" \
          UPDATER_RELEASE_TAG="$release_tag" \
          UPDATER_PLATFORM='${{ matrix.updater_platform }}' \
          UPDATER_ASSET='${{ matrix.updater_asset }}' \
          UPDATER_SIGNATURE_FILE="$updater_signature" \
          UPDATER_OUTPUT="stage/latest-${{ matrix.rust_target }}.json" \
            node scripts/generate-updater-manifest.mjs
          # Portable Windows exe — useful for power-users who don't want
          # the installer overhead. Copy it next to the setup so it ships
          # with the same release.
          if [ -f "$rel_dir/owllm-desktop.exe" ]; then
            cp "$rel_dir/owllm-desktop.exe" "stage/OwLLM-Desktop-portable-${{ matrix.rust_target }}.exe"
          fi
          if [ -f "$rel_dir/WebView2Loader.dll" ]; then
            cp "$rel_dir/WebView2Loader.dll" "stage/WebView2Loader.dll"
          fi
          echo "Staged installers:"
          ls -la stage/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: owllm-desktop/stage/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Release publisher — runs ONCE after every build job (success or
  # partial — we set always() so a single platform failure still ships
  # the working ones as a draft release for review). Collects every
  # uploaded artefact and attaches them to a GitHub Release.
  # ---------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every platform artefact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show staged artefacts
        run: |
          ls -laR dist/ || echo "(no artefacts — every build job failed)"

      # Resolve the tag/version for this release. Tag pushes carry it in
      # github.ref_name; workflow_dispatch lets the human override.
      - name: Resolve release version
        id: resolve_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No tag, no input — fall back to "dev-<short-sha>" so manual
            # builds still get a meaningful release name.
            echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge signed updater manifests
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve_version.outputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="$VERSION" node <<'NODE'
          const fs = require("fs");
          const files = fs.readdirSync("dist")
            .filter((name) => /^latest-.+\.json$/.test(name))
            .sort();
          if (files.length === 0) throw new Error("No target-qualified updater manifests were downloaded");

          let merged = null;
          const platforms = {};
          for (const file of files) {
            const manifest = JSON.parse(fs.readFileSync(`dist/${file}`, "utf8"));
            if (manifest.version !== process.env.VERSION) {
              throw new Error(`${file} is version ${manifest.version}, expected ${process.env.VERSION}`);
            }
            merged ||= manifest;
            Object.assign(platforms, manifest.platforms || {});
          }

          const requiredPlatforms = [
            "windows-x86_64",
            "darwin-aarch64",
            "darwin-x86_64",
            "linux-x86_64",
            "linux-aarch64",
          ];
          for (const platform of requiredPlatforms) {
            if (!platforms[platform]) {
              throw new Error(`Required signed updater entry is missing: ${platform}`);
            }
          }

          merged.platforms = platforms;
          merged.pub_date = new Date().toISOString();
          fs.writeFileSync("dist/latest.json", JSON.stringify(merged, null, 2) + "\n");
          for (const file of files) fs.unlinkSync(`dist/${file}`);
          console.log("Merged updater platforms:", Object.keys(platforms).sort().join(", "));
          NODE

      - name: Create / update GitHub Release on OwLLM/owllm (public)
        uses: softprops/action-gh-release@v2
        with:
          # Publish CROSS-REPO into the public distribution repository
          # OwLLM/owllm — not into this private source repo. The
          # PUBLIC_REPO_TOKEN secret must be a PAT with `repo` scope on
          # OwLLM/owllm; create one at github.com/settings/tokens, then
          # add as a repo secret in Settings -> Secrets -> Actions.
          repository: OwLLM/owllm
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          name: OwLLM Desktop ${{ steps.resolve_version.outputs.version }}
          tag_name: ${{ steps.resolve_version.outputs.version }}
          target_commitish: main
          # Publish publicly by default. The Publisher card's Host mode creates
          # the release immediately; CI mode now also publishes publicly rather
          # than leaving a hidden draft that the user has to promote manually.
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          # generate_release_notes diffs against the previous tag IN THE
          # TARGET repo. OwLLM/owllm has no source commits, so leave off
          # and supply notes manually after the release lands.
          generate_release_notes: false
          body: |
            Auto-generated release built by `.github/workflows/release.yml` in the private source repo.
          files: |
            dist/*
