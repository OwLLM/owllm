[package]
name = "bootstrap_rs"
version = "0.1.0"
edition = "2021"
description = "OWLLM Supervisor bootstrap — Rust port of bootstrap_go"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
# JSON in/out for the plan + bootstrap_env.json file
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# anyhow gives us ergonomic error propagation for app code; thiserror
# is reserved for the few library-style error enums we'll need later.
anyhow = "1"
thiserror = "1"

# Blocking HTTP client for download_file. ureq is intentionally
# minimal — sync API, single small crate, bundles rustls so there's
# no system OpenSSL dependency. Picked over reqwest because reqwest
# pulls in tokio + futures even on the blocking feature, which would
# inflate our binary by ~3 MB for nothing.
ureq = { version = "2", default-features = false, features = ["tls"] }

# SHA-256 verifier for download_file's optional hash check. RustCrypto
# audited crate, ~100 KB compiled, no transitive deps.
sha2 = "0.10"

# Lowercase hex encoding (sha2 returns bytes; we compare to the
# hex-encoded string the model emits).
hex = "0.4"

[dev-dependencies]
# Temporary directories for tests, same pattern as Go's t.TempDir().
tempfile = "3"

[profile.release]
# Match what we asked g++ for on launcher.exe: small, stripped binary
# with no unnecessary metadata.
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
