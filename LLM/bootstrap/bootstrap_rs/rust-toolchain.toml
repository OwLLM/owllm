# Pin the toolchain so the portable Rust at LLM/tools/rust/ stays in
# lockstep with what CI / contributors use. The GNU triple matches the
# MinGW link toolchain that already builds launcher.exe — no MSVC /
# Visual Studio dependency.
#
# 1.86 chosen because edition2024 is now ubiquitous in the crate
# ecosystem (idna_adapter, getrandom, fastrand and others lit it up
# in early 2025); 1.78 worked for the R1/R2 surface but lost ground
# the moment R3 pulled in ureq.
[toolchain]
channel = "1.86.0"
components = ["rustc", "cargo", "rust-std"]
targets = ["x86_64-pc-windows-gnu"]
profile = "minimal"
