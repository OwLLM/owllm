<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carousel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent; /* match container */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: rgba(60, 130, 246, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }
        #name-label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-layer">
        <div class="nav-btn" id="btn-prev">&#10094;</div>
        <div class="nav-btn" id="btn-next">&#10095;</div>
    </div>
    <div id="name-label">Loading...</div>

    <script src="js/three.min.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <script src="carousel.js"></script>
</body>
</html>
