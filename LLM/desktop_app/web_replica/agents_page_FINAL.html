/* ============================================================
   HybridFrame   //SOURCE: ui_frame/hybrid_frame/hybrid_frame_window.py
                 //SOURCE: desktop_app/main.py:29007 (production caller)
                 //SOURCE: ui_probe/_app_capture_runner.py:199 (screenshot caller)

   Production uses corner_size=18, border_thickness=18, safe_padding=2.
   The frame inflates the inner window by:
     extra_top   = badge_h//2  where badge_h = int(90*0.65) = 58 → 29
     extra_right = 75
     shift_out   = 9
     → outer = inner + (2*9+75, 2*9+29) = (1693, 989)  for 1600x960 inner
   ============================================================ */
function HybridFrame({ children, width, height }) {
  // Frame geometry calibrated from the Qt agent's tree dump (not from
  // first-principles math, which got it wrong by ~78 px vertically):
  //   Frame: 1698x1095 at (0,0)
  //   windowBorderContainer (= inner window): 1600x960 at (19, 116)
  // → left margin 19, top margin 116, right margin 79, bottom margin 19.
  // The earlier math (SHIFT_OUT + EXTRA_TOP = 38) put everything 78 px
  // higher than the real app, which the agent surfaced as a +82 pos
  // drift on every header element.
  const CORNER = 96;            // visible corner asset render size
  const BORDER = 18;            // border thickness around the inner window
  const BADGE_H = 58;           // int(90*0.65)

  const LEFT_MARGIN = 19;
  const TOP_MARGIN = 116;
  const RIGHT_MARGIN = 79;
  const BOTTOM_MARGIN = 19;

  const outerW = width + LEFT_MARGIN + RIGHT_MARGIN;
  const outerH = height + TOP_MARGIN + BOTTOM_MARGIN;

  // Frame strokes — colors match win._get_theme_colors() then darker(300) for bg
  // and alpha 220/200 for fc/ac (see _app_capture_runner.py:215).
  const fc = "rgba(120, 220, 255, 0.86)";   // primary edge
  const ac = "rgba(120, 220, 255, 0.78)";   // accent edge

  return (
    <div style={{
      position: "relative",
      width: outerW,
      height: outerH,
      background: "#06080d",
    }}>
      {/* Inner window content positioned at the real Qt offsets (19, 116). */}
      <div style={{
        position: "absolute",
        left: LEFT_MARGIN,
        top: TOP_MARGIN,
        width: width,
        height: height,
        background: "#14152a",
        overflow: "hidden",
      }}>
        {children}
      </div>

      {/* Border edges drawn at 1/2-corner inset from the screenshot edges. */}
      <div style={{
        position: "absolute", left: CORNER/2, right: CORNER/2,
        top: 10, height: BORDER,
        background: `linear-gradient(90deg, ${ac}, ${fc}, ${ac})`,
        opacity: 0.7,
      }} />
      <div style={{
        position: "absolute", left: CORNER/2, right: CORNER/2,
        bottom: 10, height: BORDER,
        background: `linear-gradient(90deg, ${ac}, ${fc}, ${ac})`,
        opacity: 0.7,
      }} />
      <div style={{
        position: "absolute", top: CORNER/2, bottom: CORNER/2,
        left: 10, width: BORDER,
        background: `linear-gradient(180deg, ${ac}, ${fc}, ${ac})`,
        opacity: 0.7,
      }} />
      <div style={{
        position: "absolute", top: CORNER/2, bottom: CORNER/2,
        right: 10, width: BORDER,
        background: `linear-gradient(180deg, ${ac}, ${fc}, ${ac})`,
        opacity: 0.7,
      }} />

      {/* Corner crests */}
      <img src={`${CORNERS}/corner_ul.png`} style={{
        position:"absolute", left: 0, top: 0,
        width: CORNER, height: CORNER, pointerEvents: "none",
      }} />
      <img src={`${CORNERS}/corner_ur.png`} style={{
        position:"absolute", right: 0, top: 0,
        width: CORNER, height: CORNER, pointerEvents: "none",
      }} />
      <img src={`${CORNERS}/corner_bl.png`} style={{
        position:"absolute", left: 0, bottom: 0,
        width: CORNER, height: CORNER, pointerEvents: "none",
      }} />
      <img src={`${CORNERS}/corner_br.png`} style={{
        position:"absolute", right: 0, bottom: 0,
        width: CORNER, height: CORNER, pointerEvents: "none",
      }} />

      {/* Top-center badge — owl_studio_square centered over the top edge of the inner window. */}
      <img src={`${ICONS}/owl_studio_square.png`} style={{
        position: "absolute",
        left: outerW/2 - BADGE_H/2,
        top: TOP_MARGIN - BADGE_H/2 - 4,
        width: BADGE_H,
        height: BADGE_H,
        pointerEvents: "none",
      }} />
    </div>
  );
}

        <button data-ui="GamifyToggle" style={{...buttonStyle, width: 91}}><span style={{fontSize:18}}>🎮</span><span>Gamify</span></button>
      </div>

      {/* CENTER — OWLLM title. Source bound 128x45 — sized tightly, not stretched */}
      <div style={{ display: "flex", justifyContent: "center" }}>
        <div data-ui="AppTitle" style={{
          textAlign: "center",

        minWidth: 567, width: 567,

        <div data-ui="HeaderVramLabel" style={{ width: "100%" }}>💾 VRAM: N/N</div>
      </div>
    </div>
  );
}

/* ============================================================
   TeamCanvas   //SOURCE: widgets/agent_team_canvas.py:164-1100
   Background: linear gradient #101522 → #06080d + radial glow
   Ring radii: card_reserve = min(410, w*0.35); cx = card_reserve + (w-card_reserve)/2
              radius = max(120, min(w,h*1.5)*0.30)
   Orbit: 340° arc (not 360°)
   Node: r = 22+4*pulse, halo radius r*2.4
   Orchestrator crest: owl_agentic.png scaled to r*1.4*0.8
   ============================================================ */
function TeamCanvas({ width, height }) {  // data-ui annotation applied to outer div below
  // Match _layout exactly. The canvas WIDTH passed in is the actual canvas pixel
  // width (after splitter assignment) — production sees ~520-600 px because the
  // left and right panes eat 280+340 of the inner 1600px.
  const w = width, h = height;
  const card_reserve = Math.min(410, w * 0.35);
  const cx = card_reserve + (w - card_reserve) / 2;
  const cy = h / 2;
  const max_radius = Math.max(120, Math.min(w, h * 1.5) * 0.30);
  const inner_offset = 130;
  const max_depth = 1;
  const step = (max_radius - inner_offset) / Math.max(1, max_depth);
  const ring_radius = inner_offset + step; // single ring for now

  // 8 specialists on a 340° arc starting at -170° from the top
  const N = 8;
  const arc_span = (Math.PI * 2) * (340 / 360);
  const start_angle = -Math.PI / 2 - arc_span / 2;
  const nodes = [];
  for (let i = 0; i < N; i++) {
    const a = start_angle + (i + 0.5) * arc_span / N;
    nodes.push({
      x: cx + ring_radius * Math.cos(a),
      y: cy + ring_radius * Math.sin(a),
      label: ["Workshop Writer", "Onboarded Coder", "Backend Server", "UI Designer",
              "Backend Hub", "Design Critic", "Frontend Coder", "Workshop Owl"][i],
    });
  }

  const orchestrator_r = 28;

  return (
    <div data-ui="AgentTeamCanvas" style={{
      position: "relative",
      width: w, height: h,
      background: "radial-gradient(ellipse at center, #1a1f33 0%, #06080d 70%)",
      overflow: "hidden",
    }}>
      {/* SVG layer for spokes and ring */}
      <svg width={w} height={h} style={{ position:"absolute", left:0, top:0 }}>
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(120,180,255,0.6)" />
            <stop offset="60%" stopColor="rgba(120,180,255,0.18)" />
            <stop offset="100%" stopColor="rgba(120,180,255,0)" />
          </radialGradient>
          <radialGradient id="orchHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(255,200,100,0.6)" />
            <stop offset="100%" stopColor="rgba(255,200,100,0)" />
          </radialGradient>
        </defs>

        {/* ring outline */}
        <circle cx={cx} cy={cy} r={ring_radius}
          fill="none" stroke="rgba(120,220,255,0.18)" strokeWidth="1.6" />

        {/* spokes from orchestrator → each node */}
        {nodes.map((n,i) => (
          <line key={i} x1={cx} y1={cy} x2={n.x} y2={n.y}
            stroke="rgba(120,220,255,0.12)" strokeWidth="1.2" />
        ))}

        {/* node halos */}
        {nodes.map((n,i) => (
          <circle key={"h"+i} cx={n.x} cy={n.y} r={28*2.4*0.5}
            fill="url(#halo)" />
        ))}

        {/* node discs */}
        {nodes.map((n,i) => (
          <circle key={"d"+i} cx={n.x} cy={n.y} r={22}
            fill="#3b4a7a" stroke="rgba(120,220,255,0.6)" strokeWidth="1.6" />
        ))}

        {/* orchestrator halo */}
        <circle cx={cx} cy={cy} r={orchestrator_r * 2.4}
          fill="url(#orchHalo)" />
        {/* orchestrator backing disc */}
        <circle cx={cx} cy={cy} r={orchestrator_r * 0.78}
          fill="#1c2244" stroke="rgba(255,200,100,0.5)" strokeWidth="2" />
      </svg>

      {/* Central crest image — owl_agentic.png, scaled to r*1.4*0.8 */}
      <img
        src={`${ICONS}/owl_agentic.png`}
        style={{
          position: "absolute",
          left: cx - orchestrator_r * 1.4 * 0.8,
          top:  cy - orchestrator_r * 1.4 * 0.8,
          width: orchestrator_r * 1.4 * 0.8 * 2,
          height: orchestrator_r * 1.4 * 0.8 * 2,
          pointerEvents: "none",
        }}
      />

      {/* Node labels — small text below each disc */}
      {nodes.map((n,i) => (
        <div key={"l"+i} style={{
          position: "absolute",
          left: n.x - 50, top: n.y + 26,
          width: 100, textAlign: "center",
          fontSize: 9, color: "#9aa0a6",
          textTransform: "uppercase", letterSpacing: 0.4,
          pointerEvents: "none",
        }}>{n.label}</div>
      ))}
    </div>
  );
}

          <button style={{

/* ============================================================
   AgentsPage — composes everything
   Inner 1600x960 window:
     ┌─ ModeBar (80h)
     ├─ SubTabs (38h)
     ├─ LocationRow (~52h)
     ├─ GoalRow (~48h)
     └─ Roster (fills) — splitter [Flow 280 | Canvas | Orchestrator 340]
   ============================================================ */
function AgentsPage() {
  // Layout truth from the Qt tree dump:
  //   inner window: 1600 x 960 at (19, 116) within the 1698 x 1095 frame
  //   AppHeader    : 1592 x 80                     at (23, 120)  (4-px padding inside the border)
  //   ProjectStrip : 1554 x 52                     at (42, 276)
  //   Goal row     : 38 high                       at y=340
  //   RosterSplitter (= workspace_stack):
  //     1554 x 665 at (42, 390)
  //   RosterLeft   : 1014 x 665  — this is the WHOLE canvas+flow area
  //     FlowTitle / Flow buttons : in a row at y=390 inside left pane
  //     AgentTeamCanvas : 1014 x 607 at (42, 390+? ~448)
  //     SuperUserCard is an OVERLAY on the canvas, not a sibling
  //   RosterRight  : 532 x 665   — the orchestrator pane
  //     LogHeader : 532 x 26 at (1064, 390)
  //     OrchestratorLogTabs : 532 x 543 below
  const INNER_W = 1600, INNER_H = 960;
  const LEFT_W = 1014, RIGHT_W = 532, SPLITTER_W = 8;

  return (
    <HybridFrame width={INNER_W} height={INNER_H}>
      <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
        <ModeBar />
        <SubTabs />
        <LocationRow />
        <GoalRow />
        <div data-ui="WorkspaceStack" style={{ height: 665, display: "flex", overflow: "hidden", background: "#06080d", padding: "0 23px" }}>
          {/* LEFT — canvas + flow header */}
          <div data-ui="RosterLeft" style={{
            width: LEFT_W,
            display: "flex", flexDirection: "column",
            background: "#0a0d14",
          }}>
            <FlowHeader />
            <div data-ui="CanvasStack" style={{ flex: 1, position: "relative" }}>
              <TeamCanvas width={LEFT_W} height={607} />
              {/* Overlays sit ON the canvas */}
              <div style={{ position: "absolute", top: 8, left: 8, width: 360 }}>
                <DesignStudioCard />
                <SuperUserCard />
              </div>
            </div>
          </div>
          <div data-ui="RosterSplitter" style={{ width: SPLITTER_W, background: "#1a1f2c" }} />
          {/* RIGHT — orchestrator pane */}
          <div style={{ width: RIGHT_W }}>
            <OrchestratorPane />
          </div>
        </div>
      </div>
    </HybridFrame>
  );
}
