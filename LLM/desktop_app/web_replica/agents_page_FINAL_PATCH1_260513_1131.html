function HybridFrame({ children, width, height }) {

  const outerH = height + FRAME_TOP + BOTTOM_OVERHANG;
  const fc = "rgba(120, 220, 255, 0.86)";
  const ac = "rgba(120, 220, 255, 0.78)";
  return (
    <div style={{ position:"relative", width:outerW, height:outerH, background:"transparent" }}>
      <div style={{ position:"absolute", left:FRAME_LEFT, top:FRAME_TOP, width, height, background:"#0d1320", overflow:"hidden" }}>
        {children}
      </div>
      <div style={{ position:"absolute", left:FRAME_LEFT+CORNER/2, width:width-CORNER, top:FRAME_TOP-BORDER/2, height:BORDER, background:`linear-gradient(90deg, ${ac}, ${fc}, ${ac})`, opacity:0.85 }} />

function TeamCanvas({ width, height }) {
  const w = width, h = height;
  const card_reserve = Math.min(410, w * 0.35);
  const cx = card_reserve + (w - card_reserve) / 2;
  const cy = h / 2;
  const max_radius = Math.max(120, Math.min(w, h * 1.5) * 0.30);
  const inner_offset = 130;
  const ring_radius = inner_offset + (max_radius - inner_offset);
  const N = 8;
  const arc_span = (Math.PI * 2) * (340 / 360);
  const start_angle = -Math.PI / 2 - arc_span / 2;
  const labels = ["UI Designer","Backend Dev","Design Critic","Frontend Coder","Workshop One","Workshop Writer","Onboarded Coder","Backend Server"];
  const nodes = [];
  for (let i = 0; i < N; i++) {
    const a = start_angle + (i + 0.5) * arc_span / N;
    nodes.push({ x: cx + ring_radius * Math.cos(a), y: cy + ring_radius * Math.sin(a), label: labels[i], active: (i === 0 || i === 3) });
  }
  const orchestrator_r = 36;
  return (
    <div data-ui="AgentTeamCanvas" style={{ position:"relative", width:w, height:h, background:`radial-gradient(ellipse at ${cx}px ${cy}px, rgba(60, 120, 200, 0.22) 0%, rgba(0, 0, 0, 0) 60%), linear-gradient(180deg, #0d1320 0%, #06080d 100%)`, overflow:"hidden" }}>
      <svg width={w} height={h} style={{ position:"absolute", left:0, top:0 }}>
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(120,220,255,0.85)" />
            <stop offset="45%" stopColor="rgba(120,220,255,0.35)" />
            <stop offset="100%" stopColor="rgba(120,220,255,0)" />
          </radialGradient>
          <radialGradient id="haloActive" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(127,223,255,1)" />
            <stop offset="40%" stopColor="rgba(127,223,255,0.55)" />
            <stop offset="100%" stopColor="rgba(127,223,255,0)" />
          </radialGradient>
          <radialGradient id="orchHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(255,210,120,0.95)" />
            <stop offset="35%" stopColor="rgba(255,190,90,0.55)" />
            <stop offset="70%" stopColor="rgba(255,180,80,0.18)" />
            <stop offset="100%" stopColor="rgba(255,180,80,0)" />
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <circle cx={cx} cy={cy} r={ring_radius} fill="none" stroke="rgba(120,220,255,0.25)" strokeWidth="1.6" strokeDasharray="4 4" />
        {nodes.map((n,i) => (
          <line key={"sp"+i} x1={cx} y1={cy} x2={n.x} y2={n.y} stroke={n.active?"rgba(120,220,255,0.65)":"rgba(120,220,255,0.18)"} strokeWidth={n.active?1.8:1.2} filter={n.active?"url(#glow)":undefined} />
        ))}
        {nodes.map((n,i) => (
          <circle key={"h"+i} cx={n.x} cy={n.y} r={n.active?52:38} fill={n.active?"url(#haloActive)":"url(#halo)"} />
        ))}
        {nodes.map((n,i) => (
          <circle key={"d"+i} cx={n.x} cy={n.y} r={22} fill="#3b4a7a" stroke={n.active?"#7fdfff":"rgba(120,220,255,0.6)"} strokeWidth={n.active?2.4:1.6} />
        ))}
        {nodes.filter(n=>n.active).map((n,i) => (
          <circle key={"r"+i} cx={n.x} cy={n.y} r={28} fill="none" stroke="rgba(127,223,255,0.7)" strokeWidth="1.4" />
        ))}
        <circle cx={cx} cy={cy} r={orchestrator_r * 3.4} fill="url(#orchHalo)" />
        <circle cx={cx} cy={cy} r={orchestrator_r * 1.8} fill="url(#orchHalo)" opacity="0.7" />
        <circle cx={cx} cy={cy} r={orchestrator_r * 1.5} fill="#1a2240" stroke="rgba(255,200,100,0.85)" strokeWidth="2.5" filter="url(#glow)" />
        <circle cx={cx} cy={cy} r={orchestrator_r * 1.5} fill="none" stroke="rgba(127,223,255,0.45)" strokeWidth="1.2" strokeDasharray="3 3" />
      </svg>
      <img src={`${ICONS}/owl_agentic.png`} style={{ position:"absolute", left:cx - orchestrator_r * 1.3, top:cy - orchestrator_r * 1.3, width:orchestrator_r * 2.6, height:orchestrator_r * 2.6, pointerEvents:"none", filter:"drop-shadow(0 0 16px rgba(255,210,120,0.85)) drop-shadow(0 0 28px rgba(255,180,80,0.45))" }} />
      <div style={{ position:"absolute", left:cx-70, top:cy + orchestrator_r * 1.7, width:140, textAlign:"center", fontSize:11, fontWeight:700, color:"#ffd97a", textTransform:"uppercase", letterSpacing:0.8, textShadow:"0 1px 3px rgba(0,0,0,0.9)", pointerEvents:"none" }}>Orchestrator</div>
      {nodes.map((n,i) => (
        <div key={"l"+i} style={{ position:"absolute", left:n.x - 60, top:n.y + 30, width:120, textAlign:"center", fontSize:12, fontWeight:600, color:n.active?"#ffffff":"#e6e8eb", textTransform:"uppercase", letterSpacing:0.4, pointerEvents:"none", textShadow:"0 1px 3px rgba(0,0,0,0.9)" }}>{n.label}</div>
      ))}
    </div>
  );
}

          <span style={{ fontSize:10, color:"#9aa0a6", padding:"2px 6px", borderRadius:4, background:"rgba(255,255,255,0.05)" }}>spec v0.3 · stage 1/3</span>
          <div style={{ flex:1 }} />
          <button style={{ padding:"4px 12px", borderRadius:14, border:"1px solid rgba(127,223,255,0.45)", background:"rgba(127,223,255,0.10)", color:"#7fdfff", fontSize:11, fontWeight:600 }}>▶ Run</button>
          <button style={{ padding:"4px 12px", borderRadius:14, border:"1px solid rgba(255,255,255,0.12)", background:"transparent", color:"#aab", fontSize:11, fontWeight:600 }}>Cancel</button>
        </div>
        <div style={{ fontSize:11, color:"#9aa0a6" }}>Routing briefs across the agent ring · click an agent to view its log.</div>
      </div>
      <div data-ui="OrchestratorLogTabs" style={{ flex:1, padding:"10px 10px", display:"flex", flexDirection:"column", gap:8, overflow:"hidden" }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
            <div style={{ width:28, height:28, flexShrink:0, borderRadius:14, background:m.color, opacity:0.85, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:"#06080d" }}>{m.role[0]}</div>
            <div style={{ flex:1, background:"rgba(255,255,255,0.04)", borderLeft:`3px solid ${m.color}`, borderRadius:8, padding:"6px 10px" }}>
              <div style={{ fontSize:10, fontWeight:700, color:m.color, textTransform:"uppercase", letterSpacing:0.5, marginBottom:2 }}>{m.role}</div>
              <div style={{ fontSize:12, color:"#dadcdf", lineHeight:1.4 }}>{m.text}</div>
            </div>
          </div>
        ))}
        <div data-ui="OrchestratorReplyView" style={{ flex:1, background:"#0f1218", borderRadius:8, padding:12, overflow:"auto", fontFamily:"Segoe UI, Inter, system-ui, sans-serif", fontSize:12.5, lineHeight:1.55, color:"#dadcdf", whiteSpace:"pre-wrap", border:"1px solid rgba(120,220,255,0.08)" }}>{reply}</div>
      </div>
    </div>
  );
}
