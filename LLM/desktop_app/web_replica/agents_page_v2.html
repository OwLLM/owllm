<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OWLLM — Agentic Team (v2)</title>
<!--
  Second iteration of the React replica. v1 hit 82 % pixel difference
  vs the captured reference — `ui_compare_screenshots` showed the gap
  was concentrated in three regions: flat agent-node discs vs the
  reference's gradient-filled glow nodes, the all-pairs connection
  mesh vs the reference's spokes-only star, and the owl emblem
  missing its cyan arc accents.

  Changes from v1:
  * Agent nodes: SVG radial gradients + outer halo + inner highlight
    rather than flat fill — matches the gradient-filled spheres in
    the live app's QGraphicsScene canvas.
  * Connection lines: spokes-from-center only. The original draws
    rays from the owl to each agent, NOT the all-pairs mesh v1 had.
  * Owl emblem: wrap in two semi-circular cyan arcs (top + bottom)
    to mimic the AgentTeamCanvas's circular HUD reticle.
  * Title bar: deeper navy + tighter spacing; mode buttons use a
    pinned-tab style for the active "Agentic Team" entry.
  * LOCATION + GOAL rows: pixel-tighter padding, real placeholder
    colors picked from the reference rather than Tailwind defaults.
  * Background: removed the random-looking radial stars and used a
    sparser, deeper-blue distribution closer to the reference.
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-deep:   #060a1c;
    --bg-mid:    #0e1530;
    --bg-light:  #182149;
    --bg-canvas: #08102b;
    --accent-cyan:   #4ed4ff;
    --accent-cyan-2: #2bb2dd;
    --accent-amber:  #f1c463;
    --accent-purple: #b481ff;
    --accent-blue:   #6fb2ff;
    --line:    rgba(170, 188, 230, 0.13);
    --text:    #dbe1f4;
    --muted:   #8993b4;
  }
  html, body { background:#050810; color:var(--text); font-family:'Segoe UI', system-ui, sans-serif; }
  /* Title bar — deeper navy with a thin highlight on the top edge so
     it reads as a 3D bezel like the production frame does. */
  .titlebar {
    background: linear-gradient(180deg, #1a234a 0%, #0e1530 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .mode-btn {
    transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.03);
  }
  .mode-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.06); }
  .mode-btn.active {
    background: rgba(241, 196, 99, 0.18);
    border-color: rgba(241, 196, 99, 0.6);
    box-shadow: 0 0 0 1px rgba(241, 196, 99, 0.3), 0 6px 14px rgba(241, 196, 99, 0.15);
  }
  .tab-active { color: var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); font-weight:600; }
  .tab-idle   { color: var(--muted); border-bottom: 2px solid transparent; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; line-height: 1; display:inline-flex; align-items:center; gap:4px; }
  .pill-green { background: rgba(76, 211, 132, 0.12); color: #7ee7a8; border: 1px solid rgba(76, 211, 132, 0.35); }
  .pill-gray  { background: rgba(120, 130, 160, 0.10); color: var(--muted); border: 1px solid rgba(120, 130, 160, 0.25); }
  .star-bg {
    background-image:
      radial-gradient(1px 1px at 8%  18%, rgba(255,255,255,0.65), transparent 1px),
      radial-gradient(1px 1px at 17% 71%, rgba(180,200,255,0.55), transparent 1px),
      radial-gradient(1px 1px at 29% 33%, rgba(180,200,255,0.45), transparent 1px),
      radial-gradient(1px 1px at 41% 88%, rgba(255,255,255,0.55), transparent 1px),
      radial-gradient(1px 1px at 56% 22%, rgba(180,200,255,0.45), transparent 1px),
      radial-gradient(1px 1px at 67% 64%, rgba(255,255,255,0.5),  transparent 1px),
      radial-gradient(1px 1px at 78% 9%,  rgba(180,200,255,0.55), transparent 1px),
      radial-gradient(1px 1px at 87% 47%, rgba(180,200,255,0.35), transparent 1px),
      radial-gradient(1px 1px at 93% 78%, rgba(255,255,255,0.5),  transparent 1px),
      radial-gradient(1px 1px at 4%  56%, rgba(180,200,255,0.4),  transparent 1px);
  }
  @keyframes owl-breathe {
    0%, 100% { filter: drop-shadow(0 0 22px rgba(78, 212, 255, 0.45)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 38px rgba(78, 212, 255, 0.78)); transform: scale(1.015); }
  }
  .owl-pulse { animation: owl-breathe 3.6s ease-in-out infinite; transform-origin: center; }
  @keyframes ring-rotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .ring-spin { animation: ring-rotate 28s linear infinite; transform-origin: center; }
</style>
</head>
<body class="m-0 p-0 min-h-screen flex items-center justify-center">

<div id="root" class="w-[1400px]"></div>

<script type="text/babel" data-presets="react">
const ASSET = "../../../icons/Page_icons";
const FRAME = `${ASSET}/CornersNew`;

// Mode toggles. The active one (Agentic Team) gets the amber pinned
// treatment from the live app's theme.
const MODES = [
  { id: "dark",       label: "Dark",        icon: "🌙" },
  { id: "advanced",   label: "Advanced",    icon: "⚙" },
  { id: "fineTuning", label: "Fine Tuning", icon: "🔧" },
  { id: "agentic",    label: "Agentic Team", iconPath: `${ASSET}/owl_AgenticTeam.png`, active: true },
  { id: "gamify",     label: "Gamify",      icon: "🎮" },
];

const TABS = [
  { id: "home",    label: "🏠 Home" },
  { id: "code",    label: "▦ Code" },
  { id: "agents",  label: "👥 Agents", active: true },
  { id: "studio",  label: "🎬 Studio" },
  { id: "bridges", label: "🌉 Bridges" },
  { id: "server",  label: "🖧 Server" },
];

// 8 agents — same names + cohort split as the captured reference.
// Color buckets: blue cohort = orchestrator + product (top-right),
// purple cohort = engineering + design (left + bottom).
const AGENTS = [
  { name: "Orchestrator",      cohort: "blue" },
  { name: "Product Owner",     cohort: "blue" },
  { name: "UX Designer",       cohort: "blue" },
  { name: "Backend Arch",      cohort: "purple" },
  { name: "Whitepaper Writer", cohort: "purple" },
  { name: "Design Critic",     cohort: "purple" },
  { name: "Frontend Coder",    cohort: "purple" },
  { name: "Backend Coder",     cohort: "purple" },
];

function ModeButton({ mode }) {
  return (
    <button
      className={`mode-btn flex flex-col items-center justify-center px-3 py-1.5 rounded-md ${mode.active ? "active" : ""}`}
      style={{ minWidth: 72 }}
    >
      <div className="text-lg leading-none mb-0.5">
        {mode.iconPath
          ? <img src={mode.iconPath} className="h-6 w-6 object-contain" alt="" />
          : <span>{mode.icon}</span>}
      </div>
      <div className="text-[11px] tracking-wide opacity-90">{mode.label}</div>
    </button>
  );
}

function TitleBar() {
  return (
    <div className="titlebar relative flex items-center justify-between px-4 py-2.5 border-b border-white/5">
      <div className="flex items-center gap-1.5">
        {MODES.map(m => <ModeButton key={m.id} mode={m} />)}
      </div>
      <div className="flex items-center gap-7">
        <div className="text-[32px] font-light tracking-[0.16em] text-white/95"
             style={{ fontFamily: "'Segoe UI Light', 'Inter', sans-serif" }}>
          OWLLM
        </div>
        <div className="text-[11px] leading-tight">
          <div className="flex items-center gap-1.5"><span className="text-emerald-400">●</span> <span className="text-white/80">Servers: 0</span></div>
          <div className="flex items-center gap-1.5"><span>🔑</span> <span className="text-white/80">API key:</span> <span className="text-white/95">owllm-local</span></div>
          <div className="flex items-center gap-1.5"><span>💾</span> <span className="text-white/80">VRAM: N/A</span></div>
        </div>
      </div>
      <div className="flex items-center gap-3 text-white/70">
        <button title="Maximize" className="px-2 py-0.5 hover:text-white">⛶</button>
        <button title="Close"    className="px-2 py-0.5 hover:text-rose-400">✕</button>
      </div>
    </div>
  );
}

function TabBar() {
  return (
    <div className="flex items-end gap-6 px-5 pt-2.5 pb-0 border-b border-white/5"
         style={{ background: "var(--bg-mid)" }}>
      {TABS.map(t => (
        <button key={t.id}
          className={`pb-2 text-[13px] tracking-wide ${t.active ? "tab-active" : "tab-idle"}`}>
          {t.label}
        </button>
      ))}
      <div className="ml-auto pb-2 text-[12px] text-cyan-400/80">ⓘ Info</div>
    </div>
  );
}

function LocationRow() {
  return (
    <div className="flex items-center gap-3 px-4 py-2 text-xs"
         style={{ background: "#0f1530", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
      <span className="text-white/55 font-semibold tracking-wider">LOCATION</span>
      <div className="flex-1 max-w-[440px] px-3 py-1.5 rounded bg-black/40 border border-white/10 text-white/85 font-mono text-[11px]">
        /path/to/repo · esp-flash · github.com/…
      </div>
      <button className="px-3 py-1.5 rounded bg-white/5 border border-white/10 hover:bg-white/10">Browse…</button>
      <label className="flex items-center gap-1.5 text-white/70">
        <input type="checkbox" className="accent-cyan-400" /> Trust writes
      </label>
      <span className="pill pill-green">● Sandboxed</span>
      <span className="pill pill-gray">📓 Bridge: OFF</span>
      <span className="ml-2 text-white/55 font-semibold tracking-wider">PROJECT</span>
      <select className="px-3 py-1.5 rounded bg-black/40 border border-white/10 text-white/90 text-xs">
        <option>Product Studio Test</option>
      </select>
      <button className="px-3 py-1.5 rounded bg-white/5 border border-white/10 hover:bg-white/10">Team…</button>
      <button className="px-3 py-1.5 rounded bg-white/5 border border-white/10 hover:bg-white/10">+ New</button>
      <button className="px-3 py-1.5 rounded bg-white/5 border border-white/10 hover:bg-white/10">Rename</button>
      <button className="px-3 py-1.5 rounded bg-white/5 border border-rose-500/30 text-rose-400 hover:bg-rose-500/10">Delete</button>
    </div>
  );
}

function GoalBar() {
  return (
    <div className="flex items-center gap-2 px-4 py-2 border-b border-white/5"
         style={{ background: "#0a1128" }}>
      <button className="text-white/60 hover:text-white px-1">📎</button>
      <input
        className="flex-1 bg-transparent outline-none text-[12px] text-white/85 placeholder:text-white/35 font-mono"
        placeholder="Goal — e.g. 'summarise the last commit and propose a follow-up'  (drop an image / audio here)"
      />
      <button className="px-5 py-1.5 rounded text-slate-900 font-semibold"
              style={{ background: "linear-gradient(180deg, #6db8ff 0%, #4d9dff 100%)" }}>
        Run
      </button>
      <button className="px-5 py-1.5 rounded bg-white/5 border border-white/10 text-white/70 hover:bg-white/10">Cancel</button>
      <button className="text-rose-400 px-1 text-lg leading-none" title="Record">●</button>
      <button className="text-white/60 hover:text-white px-1" title="Voice">🔊</button>
    </div>
  );
}

function AgentNode({ x, y, name, cohort }) {
  // Two-layer SVG node: outer halo (40 px radius, low opacity) + the
  // main gradient sphere (22 px radius). Cohort tints the gradient.
  const stops = cohort === "blue"
    ? { core: "#a3d8ff", mid: "#6fb2ff", edge: "#3d7adb" }
    : { core: "#e0c7ff", mid: "#b481ff", edge: "#7a4fcf" };
  const gradId = `grad-${name.replace(/\s+/g, "-")}`;
  return (
    <g>
      <defs>
        <radialGradient id={gradId} cx="50%" cy="40%" r="60%">
          <stop offset="0%"   stopColor={stops.core} />
          <stop offset="55%"  stopColor={stops.mid} />
          <stop offset="100%" stopColor={stops.edge} />
        </radialGradient>
      </defs>
      <circle cx={x} cy={y} r={36} fill={stops.mid} opacity="0.18" />
      <circle cx={x} cy={y} r={28} fill={stops.mid} opacity="0.32" />
      <circle cx={x} cy={y} r={22} fill={`url(#${gradId})`} />
      <circle cx={x} cy={y} r={22} fill="none" stroke="rgba(255,255,255,0.45)" strokeWidth="1" />
      {/* Specular highlight */}
      <ellipse cx={x - 4} cy={y - 6} rx="6" ry="3" fill="rgba(255,255,255,0.55)" />
    </g>
  );
}

function AgentCanvas() {
  const W = 1352, H = 700, cx = W / 2, cy = H / 2;
  const R = 248; // Tighter octagon than v1's 270 — matches the reference.

  const positions = AGENTS.map((a, i) => {
    const angle = (-Math.PI / 2) + (i * 2 * Math.PI / AGENTS.length);
    return { ...a, x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle) };
  });

  return (
    <div className="relative star-bg overflow-hidden"
         style={{ width: W, height: H, background: "var(--bg-canvas)" }}>
      <svg width={W} height={H} className="absolute inset-0">
        {/* Spokes-from-center only — NOT the all-pairs mesh v1 had. */}
        {positions.map((a, i) => (
          <line key={`spoke-${i}`}
            x1={cx} y1={cy} x2={a.x} y2={a.y}
            stroke="rgba(180,200,255,0.18)" strokeWidth="1"
            strokeDasharray="3 5" />
        ))}
        {/* Outer ring — connects adjacent agents only, dotted lighter. */}
        {positions.map((a, i) => {
          const b = positions[(i + 1) % positions.length];
          return (
            <line key={`ring-${i}`}
              x1={a.x} y1={a.y} x2={b.x} y2={b.y}
              stroke="rgba(180,200,255,0.10)" strokeWidth="1"
              strokeDasharray="2 7" />
          );
        })}
        {/* HUD reticle around the owl: two semi-circular cyan arcs +
            two small ticks, mimicking the AgentTeamCanvas decoration. */}
        <g className="ring-spin" style={{ transformOrigin: `${cx}px ${cy}px` }}>
          <path d={`M ${cx - 130} ${cy} A 130 130 0 0 1 ${cx + 130} ${cy}`}
                fill="none" stroke="var(--accent-cyan)" strokeWidth="2" opacity="0.55" />
          <path d={`M ${cx + 130} ${cy} A 130 130 0 0 1 ${cx - 130} ${cy}`}
                fill="none" stroke="var(--accent-cyan)" strokeWidth="2" opacity="0.25"
                strokeDasharray="4 8" />
        </g>
        {/* Agent nodes on top of lines. */}
        {positions.map(a => <AgentNode key={a.name} {...a} />)}
      </svg>
      {/* Labels in DOM so they pick up Segoe UI. */}
      {positions.map(a => (
        <div key={`l-${a.name}`}
          className="absolute text-[12px] text-white/90 font-medium"
          style={{ left: a.x, top: a.y + 32, transform: "translateX(-50%)" }}>
          {a.name}
        </div>
      ))}
      {/* Center owl with breathing glow. */}
      <div className="absolute owl-pulse"
        style={{ left: cx, top: cy, transform: "translate(-50%, -50%)" }}>
        <img src={`${ASSET}/owl_studio_square.png`}
             className="h-[200px] w-[200px] object-contain" alt="OWLLM" />
      </div>
      <div className="absolute bottom-3 left-1/2 -translate-x-1/2 text-white/70 text-[11px] font-mono tracking-wide">
        Ready.
      </div>
    </div>
  );
}

function Frame({ children }) {
  return (
    <div className="relative" style={{ padding: "48px 64px 32px 44px" }}>
      <img src={`${FRAME}/corner_ul.png`} alt="" className="pointer-events-none select-none absolute"
           style={{ top: 6, left: 0, height: 110 }} />
      <img src={`${FRAME}/corner_ur.png`} alt="" className="pointer-events-none select-none absolute"
           style={{ top: 6, right: 0, height: 110 }} />
      <img src={`${FRAME}/corner_bl.png`} alt="" className="pointer-events-none select-none absolute"
           style={{ bottom: 0, left: 0, height: 96 }} />
      <img src={`${FRAME}/corner_br.png`} alt="" className="pointer-events-none select-none absolute"
           style={{ bottom: 0, right: 0, height: 96 }} />
      <img src={`${ASSET}/owl_studio_square.png`} alt="" className="pointer-events-none select-none absolute"
           style={{ top: -22, left: "50%", transform: "translateX(-50%)", height: 96 }} />
      <div className="rounded-md overflow-hidden border border-white/8 shadow-2xl"
           style={{ background: "var(--bg-mid)" }}>
        {children}
      </div>
    </div>
  );
}

function App() {
  return (
    <Frame>
      <TitleBar />
      <TabBar />
      <LocationRow />
      <GoalBar />
      <AgentCanvas />
    </Frame>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
