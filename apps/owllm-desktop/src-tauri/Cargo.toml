[package]
name = "owllm-desktop"
version = "0.1.0"
description = "OwLLM parallel desktop shell (Tauri + React + Python engine)"
authors = ["LocaLLM"]
edition = "2021"

[lib]
name = "owllm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
