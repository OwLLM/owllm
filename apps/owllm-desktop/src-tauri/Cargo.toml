[package]
name = "owllm-desktop"
version = "0.1.0"
description = "OwLLM Desktop — Tauri + React. Rust owns the runtime; Python is invited on-demand only for fine-tuning."
authors = ["LocaLLM"]
edition = "2021"

[lib]
name = "owllm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Runtime dependencies — kept deliberately small. NO reqwest / HTTP
# client (was only used to talk to the deleted python_engine server).
# tokio "process" feature stays — future native llama.cpp spawn will
# use it with CREATE_NO_WINDOW.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
thiserror = "1"
# Cross-platform CPU/RAM probe. GPU detection still goes via the
# Windows-specific wmic shell-out below (no NVML dep yet).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Read the legacy LLM/data/owllm_state.db for project listing (agentic
# tab). `bundled` ships the SQLite C lib so we don't depend on an
# externally installed sqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native folder/file picker for the LocationRow's Browse… button. The
# tauri-plugin-dialog setup is heavier (needs JS-side init + permission
# config); rfd is a direct, no-plugin path that opens the system's
# folder dialog on the same UI thread we already own.
rfd = "0.15"
# HTTP client for outbound calls to services that don't speak CORS
# (Telegram Bot API in particular — fetch() from the webview gets
# blocked because api.telegram.org doesn't send the relevant headers).
# rustls-tls so we don't need OpenSSL on the build host. blocking
# feature so the Tauri commands can stay synchronous-flavoured under
# tokio's async runtime without ping-ponging through spawn_blocking.
# `stream` feature unlocks Response::bytes_stream() — needed by the
# huggingface::hf_download streaming progress emitter.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Used by telegram::telegram_download_file to base64-encode media bytes
# for the JS-side Attachment carrier. No-default-features keeps the dep
# lean (we don't need the alloc/std features for this single helper).
base64 = "0.22"
# URL-encode HF model ids before stitching them into REST paths so
# names like "TheBloke/Llama-2-7B-GGUF" survive the round-trip (the
# slash needs to stay as a slash for the route, but anything else
# gets encoded). Tiny, no deps of its own.
urlencoding = "2"
# Stream combinator for reqwest::Response::bytes_stream() —
# `while let Some(chunk) = stream.next().await` needs StreamExt.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# ISO-8601 timestamps for list_tuned_adapters() and env_manager state.
# default-features=false drops the deprecated `time` integration to
# keep the dep slim; "clock" is what we need for DateTime::from_timestamp.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# YAML for env_profiles.yaml — the env-install manifest the app fetches
# from the repo + caches locally. JSON would work too but YAML is more
# readable for the hand-curated profile list.
serde_yaml = "0.9"
# Hash env profile sources so we can detect manifest changes and
# trigger reinstalls atomically. SHA-256 is overkill for a 20-line
# YAML but it's the same hash the rest of the app uses elsewhere.
sha2 = "0.10"
# Cross-platform pseudo-terminal for the in-app CLI terminal that
# replaces the pop-out CMD window during subscription-CLI login.
# Uses ConPTY on Windows 10+/11 (no extra dep) and forkpty on Unix.
portable-pty = "0.8"
# UUID for PTY session ids — each spawn returns a session id the
# React side passes back on write/resize/kill.
uuid = { version = "1", features = ["v4"] }
# Lock-free singleton for the PTY session map shared between commands.
once_cell = "1"
[dev-dependencies]
tempfile = "3"

# Release profile: use Cargo defaults (opt-level=3, codegen-units=16)
# plus LTO for the smallest, fastest binary. The previous override
# (opt-level=2, codegen-units=256, lto=false) existed only to dodge
# GNU rustc heap-corruption on the local machine — on the MSVC CI
# toolchain it pessimized the binary so much that Tauri startup grew
# from <1s to ~2s with a visible WebView2 white flash. We don't build
# GNU anymore, so let the optimizer do its job.
[profile.release]
lto = "thin"
strip = "debuginfo"
