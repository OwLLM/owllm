[package]
name = "owllm-desktop"
version = "0.1.0"
description = "OwLLM Desktop — Tauri + React. Rust owns the runtime; Python is invited on-demand only for fine-tuning."
authors = ["LocaLLM"]
edition = "2021"

[lib]
name = "owllm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Runtime dependencies — kept deliberately small. NO reqwest / HTTP
# client (was only used to talk to the deleted python_engine server).
# tokio "process" feature stays — future native llama.cpp spawn will
# use it with CREATE_NO_WINDOW.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
