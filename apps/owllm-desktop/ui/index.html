<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWLLM — Agentic Team</title>
  </head>
  <body style="margin:0;background:transparent;">
    <!-- White-flash cover: WebView2 in setup() is set to alpha=0 so the
         pre-HTML init paints the desktop wallpaper instead of opaque
         white. The instant the HTML parses, this splash fills the
         viewport with the app's dark canvas color so the wallpaper
         flash is covered. When ReactDOM.createRoot().render() runs,
         it replaces #root's children, so the splash naturally
         disappears the moment the React tree mounts. -->
    <div id="root">
      <div style="position:fixed;inset:0;background:#06080d;"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
