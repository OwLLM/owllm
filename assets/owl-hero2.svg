<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ec5d8" />
      <stop offset="100%" stop-color="#1a8a9b" />
    </linearGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="60%" stop-color="#fff" />
      <stop offset="100%" stop-color="#cfe7eb" />
    </radialGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="115" rx="60" ry="65" fill="url(#bodyGrad)" />
  <!-- Head tufts -->
  <path d="M 55 65 L 50 35 L 75 55 Z" fill="#1a8a9b" />
  <path d="M 145 65 L 150 35 L 125 55 Z" fill="#1a8a9b" />
  <!-- Eye sockets -->
  <circle cx="78" cy="85" r="22" fill="#0c1018" />
  <circle cx="122" cy="85" r="22" fill="#0c1018" />
  <!-- Eyes -->
  <circle cx="78" cy="85" r="16" fill="url(#eyeGrad)" />
  <circle cx="122" cy="85" r="16" fill="url(#eyeGrad)" />
  <!-- Pupils -->
  <circle cx="78" cy="87" r="7" fill="#0c1018" />
  <circle cx="122" cy="87" r="7" fill="#0c1018" />
  <!-- Eye highlights -->
  <circle cx="80" cy="84" r="2" fill="#fff" />
  <circle cx="124" cy="84" r="2" fill="#fff" />
  <!-- Beak -->
  <path d="M 100 95 L 92 110 L 108 110 Z" fill="#f0b040" stroke="#a87420" stroke-width="1" />
  <!-- Wing hints -->
  <path d="M 50 130 Q 55 165 80 170" stroke="#0e6a78" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 150 130 Q 145 165 120 170" stroke="#0e6a78" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Feet -->
  <path d="M 88 175 L 88 185 M 84 182 L 92 182" stroke="#f0b040" stroke-width="2" stroke-linecap="round" />
  <path d="M 112 175 L 112 185 M 108 182 L 116 182" stroke="#f0b040" stroke-width="2" stroke-linecap="round" />
</svg>
