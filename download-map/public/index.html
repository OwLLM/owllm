<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>OwLLM — Download Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #070b14; color: #dbe4f3;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header { padding: 16px 22px; border-bottom: 1px solid #1a2740; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .total { margin-left: auto; font-size: 13px; color: #8aa0c6; }
  header .total b { color: #4da3ff; font-size: 18px; }
  .wrap { display: grid; grid-template-columns: 1fr 300px; gap: 0; height: calc(100vh - 58px); }
  #map { width: 100%; height: 100%; }
  aside { border-left: 1px solid #1a2740; overflow-y: auto; padding: 14px 16px; }
  aside h2 { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #6f86ab; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 4px; border-bottom: 1px solid #141f33; }
  td.n { text-align: right; color: #4da3ff; font-variant-numeric: tabular-nums; font-weight: 600; }
  .flag { margin-right: 7px; }
  .gate { max-width: 420px; margin: 12vh auto; padding: 26px; background: #0c1322; border: 1px solid #1f2d49; border-radius: 12px; }
  .gate h1 { font-size: 16px; margin: 0 0 6px; }
  .gate p { color: #8aa0c6; margin: 0 0 16px; }
  .gate input { width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid #2a3a5c; background: #070b14; color: #dbe4f3; font-size: 14px; }
  .gate button { margin-top: 12px; height: 38px; padding: 0 18px; border: none; border-radius: 8px; background: #2f6fd4; color: #fff; font-weight: 700; cursor: pointer; }
  .err { color: #ff9a9a; margin-top: 10px; min-height: 18px; font-size: 13px; }
  .muted { color: #6f86ab; font-size: 12px; }
  button.ghost { background: none; border: 1px solid #2a3a5c; color: #9fb4d6; border-radius: 7px; height: 30px; padding: 0 12px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js"></script>
<script>
const TOKEN_KEY = "owllm_stats_token";
const app = document.getElementById("app");

// ISO-2 → flag emoji (regional indicator letters). Pure cosmetic.
function flag(cc) {
  if (!/^[A-Z]{2}$/.test(cc)) return "🏳";
  return String.fromCodePoint(...[...cc].map(c => 0x1f1e6 + c.charCodeAt(0) - 65));
}
const COUNTRY_NAMES = new Intl.DisplayNames(["en"], { type: "region" });
function name(cc) {
  if (cc === "ZZ") return "Unknown";
  try { return COUNTRY_NAMES.of(cc) || cc; } catch { return cc; }
}

function tokenFromUrl() {
  const m = location.hash.match(/token=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function renderGate(message) {
  app.innerHTML = `
    <div class="gate">
      <h1>🦉 OwLLM Download Map</h1>
      <p>Enter your stats token to view the map. (Set as <code>STATS_TOKEN</code> in Netlify.)</p>
      <input id="tok" type="password" placeholder="stats token" autofocus />
      <div><button id="go">View map</button></div>
      <div class="err">${message || ""}</div>
    </div>`;
  const go = () => {
    const t = document.getElementById("tok").value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    load(t);
  };
  document.getElementById("go").onclick = go;
  document.getElementById("tok").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function renderMap(counts) {
  // Split aggregate metadata (keys starting with "__") from country counts.
  const total = counts.__total || 0;
  const values = {};
  for (const [k, v] of Object.entries(counts)) {
    if (k.startsWith("__")) continue;
    if (k === "ZZ") continue;           // unknowns aren't placeable on the map
    values[k] = v;
  }
  const rows = Object.entries(counts)
    .filter(([k]) => !k.startsWith("__"))
    .sort((a, b) => b[1] - a[1]);

  app.innerHTML = `
    <header>
      <h1>🦉 OwLLM Download Map</h1>
      <button class="ghost" id="refresh">↻ Refresh</button>
      <button class="ghost" id="logout">Sign out</button>
      <div class="total">Total downloads <b>${total.toLocaleString()}</b></div>
    </header>
    <div class="wrap">
      <div id="map"></div>
      <aside>
        <h2>By country (${rows.length})</h2>
        <table>${rows.map(([cc, n]) =>
          `<tr><td><span class="flag">${flag(cc)}</span>${name(cc)}</td><td class="n">${n.toLocaleString()}</td></tr>`
        ).join("") || `<tr><td class="muted">No downloads yet.</td></tr>`}</table>
        <p class="muted" style="margin-top:14px">Country-level only · no IPs, cookies, or identifiers stored.</p>
      </aside>
    </div>`;

  document.getElementById("refresh").onclick = () => load(localStorage.getItem(TOKEN_KEY));
  document.getElementById("logout").onclick = () => { localStorage.removeItem(TOKEN_KEY); location.hash = ""; renderGate(""); };

  // eslint-disable-next-line no-undef
  new jsVectorMap({
    selector: "#map",
    map: "world",
    zoomButtons: true,
    backgroundColor: "transparent",
    regionStyle: {
      initial: { fill: "#1b2740", stroke: "#0a0f1a", strokeWidth: 0.4 },
      hover: { fillOpacity: 0.85 },
    },
    series: {
      regions: [{
        attribute: "fill",
        scale: ["#22406e", "#4da3ff"],
        normalizeFunction: "polynomial",
        values,
      }],
    },
    onRegionTooltipShow(event, tooltip, code) {
      const n = values[code] || 0;
      tooltip.text(`${tooltip.text()} — ${n.toLocaleString()} download${n === 1 ? "" : "s"}`, true);
    },
  });
}

async function load(token) {
  if (!token) return renderGate("");
  app.innerHTML = `<div class="gate"><h1>Loading…</h1></div>`;
  try {
    const res = await fetch(`/stats?token=${encodeURIComponent(token)}`, { cache: "no-store" });
    if (res.status === 403) { localStorage.removeItem(TOKEN_KEY); return renderGate("Wrong token."); }
    if (!res.ok) return renderGate(`Error ${res.status}.`);
    renderMap(await res.json());
  } catch (e) {
    renderGate("Network error — is the site deployed?");
  }
}

load(tokenFromUrl() || localStorage.getItem(TOKEN_KEY) || "");
</script>
</body>
</html>
