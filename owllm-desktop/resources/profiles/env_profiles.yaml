# env_profiles — declarative Python environment manifests for the
# fine-tuning page. Each top-level dict is one environment the user
# can install via the Train page's "Environment" picker.
#
# On Windows these envs are built and run INSIDE WSL (fine-tuning needs
# a real Linux CUDA stack); on native Linux they're local venvs. Same
# manifest either way.
#
# There are deliberately only TWO environments, because in reality there
# are only two distinct setups:
#   * Standard — the HuggingFace transformers + PEFT stack. The SAME env
#     trains every supported family (Gemma, Llama, Mistral, Mixtral,
#     Qwen, Phi). "Gemma" vs "Llama" were never different environments,
#     just different base models. flash-attn is an optional speedup, not
#     an environment — it's included with `optional: true` so it installs
#     when a matching wheel exists and is skipped (never fatal) otherwise.
#   * Unsloth — a genuinely different training backend (its own patched
#     kernels), 2-5× faster. The one real alternative.
#
# Pinning rules:
#   * Every package needs an exact version (== X.Y.Z). No floating
#     ranges — installs must be reproducible.
#   * For PyTorch, set `cuda_wheel: true` and give a PLAIN version
#     ("2.5.1", no +cuXXX tag). The app detects the machine's CUDA
#     (driver) and installs the matching cu118 / cu121 / cu124 build —
#     so one profile fits every NVIDIA card instead of a per-CUDA copy.
#     (Use `index_url:` instead only for a fixed non-PyPI wheel.)
#   * Architecture coverage: a package may carry `version_blackwell:` (and
#     optional `index_blackwell:`) — the build used INSTEAD when a
#     Blackwell-class GPU (RTX 50xx, compute >= 12.0) is detected. The
#     default pins stay for older cards. This keeps ONE profile working
#     across the whole NVIDIA range; add a row for the next generation
#     instead of locking anyone out. (Engine: env_manager resolve +
#     max_compute_cap.)
#   * Order matters — torch (with its resolved index) installs before
#     transformers, which would otherwise pull a CPU torch transitively.
#   * `probe:` must print "OK\n" on success. The probe stdout is
#     surfaced verbatim to the user on failure, so write helpful
#     error messages.
#
# NOTE: this file is currently read from the BUNDLED copy only
# (env_manager::read_profiles_yaml reads it locally) — the GitHub-Raw
# hot-fetch is a TODO, so today a profile change ships with an app
# release. When the remote fetch lands, edits here reach users without a
# reinstall.

- name: standard
  display: "Standard fine-tuning · transformers + PEFT · auto-CUDA"
  description: >-
    The full HuggingFace LoRA stack — ONE env that trains every supported
    family: Gemma 2, Llama 2/3/3.1/3.2, Mistral, Mixtral, Qwen-2.5, Phi.
    peft + transformers for training, bitsandbytes for 4-bit loading.
    torch auto-matches your hardware (cu118/121/124 on RTX 20xx-40xx and
    pro cards, or cu128 / torch 2.7 on RTX 50xx / Blackwell). flash-attn
    is included as an OPTIONAL speedup — if its prebuilt wheel doesn't
    match your exact torch/CUDA it's skipped automatically, never blocking
    the install.
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1"
      cuda_wheel: true
      # Blackwell (RTX 50xx, sm_120) isn't in torch 2.5.1; cu128 + torch 2.7
      # is the first build that supports it. Applied only on a Blackwell GPU.
      version_blackwell: "2.7.1"
      index_blackwell: "https://download.pytorch.org/whl/cu128"
    - name: transformers
      version: "4.46.0"
    - name: peft
      version: "0.13.0"
    - name: accelerate
      version: "1.1.0"
    - name: bitsandbytes
      version: "0.44.1"
      # Blackwell sm_120 4-bit kernels first SHIP in bitsandbytes 0.45.3
      # (the cu128 build); 0.45.0/0.45.1 had build-system support but NO
      # Blackwell binaries. Verified: bitsandbytes releases + issue #1642.
      version_blackwell: "0.45.3"
    - name: datasets
      version: "3.0.1"
    - name: sentencepiece
      version: "0.2.0"
    - name: trl
      version: "0.11.4"
    # trl's SFTTrainer imports `rich` at module load, but trl 0.11.x does NOT
    # pin it as a hard dependency, so a clean pinned install omits it and
    # training dies with `ModuleNotFoundError: No module named 'rich'` the
    # moment finetune.py does `from trl import SFTTrainer`. Pin it explicitly.
    - name: rich
      version: "13.9.4"
    # OPTIONAL speedup. Prebuilt only for exact torch×CUDA×python combos;
    # if pip can't find a matching wheel it would try a slow source build,
    # so `optional: true` lets the install skip it gracefully instead of
    # failing. Training still works without it (uses sdpa/eager attention).
    - name: flash-attn
      version: "2.7.0.post2"
      optional: true
  probe: |
    import torch, transformers, peft, accelerate, bitsandbytes, datasets
    # Import what finetune.py actually imports — `import trl` lazily succeeds
    # even if SFTTrainer's deps (e.g. rich) are missing, which made a broken
    # env falsely report "ready". This catches it.
    from trl import SFTTrainer, SFTConfig
    assert torch.cuda.is_available(), "torch built without CUDA — wheel install picked the CPU build"
    try:
        import flash_attn
        fa = f"flash-attn {flash_attn.__version__}"
    except Exception:
        fa = "flash-attn not installed (optional — using default attention)"
    print(f"torch {torch.__version__} · transformers {transformers.__version__} · peft {peft.__version__}")
    print(f"cuda {torch.version.cuda} · device {torch.cuda.get_device_name(0)} · {fa}")
    print("OK")

- name: unsloth
  display: "Unsloth (fast) · auto-CUDA"
  description: >-
    Unsloth-accelerated LoRA — 2-5× faster than the vanilla transformers
    loop, with its own patched kernels. Installed via Unsloth's OFFICIAL
    `uv --torch-backend=auto` path: uv detects your GPU/driver and pulls a
    coherent stack (the right torch CUDA wheel — cu124 on RTX 20xx-40xx,
    cu128 on RTX 50xx/Blackwell — plus matching unsloth / unsloth-zoo /
    transformers / triton / xformers / bitsandbytes). Avoids the version-skew
    breakage from forcing an off-matrix torch under a pinned unsloth.
    Linux-first, so on Windows it runs in WSL.
  python: "3.11"
  # Let uv resolve a coherent, GPU-matched stack itself (verified live:
  # picks torch 2.10+cu129 on a 4090; cu128 on Blackwell). See env_manager
  # run_install torch_backend branch. unsloth has NO version-matched extra
  # for torch 2.5.1, so hand-pinning it was the root of the install failures.
  torch_backend: auto
  packages:
    # Names only — `version` is IGNORED when torch_backend is set; uv resolves
    # mutually-compatible versions for the detected GPU. unsloth pulls
    # unsloth-zoo/transformers/triton/xformers itself; bitsandbytes listed so
    # 4-bit loading is present (and gets the Blackwell build on RTX 50xx).
    - name: unsloth
      version: "latest"
    - name: unsloth_zoo
      version: "latest"
    - name: bitsandbytes
      version: "latest"
    # unsloth pulls trl transitively, and trl's SFTTrainer imports `rich` —
    # which trl 0.11.x doesn't pin, so it can be absent here too. List it so
    # `from trl import SFTTrainer` (what finetune.py does) doesn't blow up.
    - name: rich
      version: "latest"
  probe: |
    import unsloth, torch
    assert torch.cuda.is_available(), "torch built without CUDA"
    # finetune.py drives training through trl's SFTTrainer for BOTH envs, so
    # verify the REAL import here — `import unsloth` alone wouldn't catch a
    # missing trl/SFTTrainer dependency (e.g. rich) and the env would falsely
    # report "ready".
    from trl import SFTTrainer, SFTConfig
    # NOTE: the `unsloth` module has no __version__ attribute — referencing it
    # was a false-negative in an earlier probe. Just confirm the imports + CUDA.
    print(f"torch {torch.__version__} · cuda {torch.version.cuda} · device {torch.cuda.get_device_name(0)}")
    print("unsloth ready")
    print("OK")
