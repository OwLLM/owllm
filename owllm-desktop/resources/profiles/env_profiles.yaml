# env_profiles — declarative Python environment manifests for the
# fine-tuning page. Each top-level dict is one environment the user
# can install via the Train page's "Environment" picker.
#
# On Windows these envs are built and run INSIDE WSL (fine-tuning needs
# a real Linux CUDA stack); on native Linux they're local venvs. Same
# manifest either way.
#
# Pinning rules:
#   * Every package needs an exact version (== X.Y.Z). No floating
#     ranges — installs must be reproducible.
#   * For PyTorch, set `cuda_wheel: true` and give a PLAIN version
#     ("2.5.1", no +cuXXX tag). The app detects the machine's CUDA
#     (driver) and installs the matching cu118 / cu121 / cu124 build —
#     so one profile fits every NVIDIA card instead of a per-CUDA copy.
#     (Use `index_url:` instead only for a fixed non-PyPI wheel.)
#   * Architecture coverage: a package may carry `version_blackwell:` (and
#     optional `index_blackwell:`) — the build used INSTEAD when a
#     Blackwell-class GPU (RTX 50xx, compute >= 12.0) is detected. The
#     default pins stay for older cards. This keeps ONE profile working
#     across the whole NVIDIA range; add a row for the next generation
#     instead of locking anyone out. (Engine: env_manager resolve +
#     max_compute_cap.)
#   * Order matters — torch (with its resolved index) installs before
#     transformers, which would otherwise pull a CPU torch transitively.
#   * `probe:` must print "OK\n" on success. The probe stdout is
#     surfaced verbatim to the user on failure, so write helpful
#     error messages.
#
# To add a profile: append an entry, commit, push. The app fetches this
# file from GitHub Raw on launch (cached 24 h) so users see new envs
# without reinstalling the app.

- name: gemma-finetune
  display: "Gemma fine-tuning · auto-CUDA"
  description: >-
    Gemma 2 base models (2B / 9B / 27B). LoRA via peft + transformers,
    4-bit loading through bitsandbytes. Runs on any CUDA NVIDIA GPU —
    torch auto-matches your hardware: RTX 20xx/30xx/40xx and pro cards
    (A2000 / A100) get the cu118/121/124 build; RTX 50xx / Blackwell
    automatically gets the cu128 torch 2.7 build.
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1"
      cuda_wheel: true
      # Blackwell (RTX 50xx, sm_120) isn't in torch 2.5.1; cu128 + torch 2.7
      # is the first build that supports it. Applied only on a Blackwell GPU.
      version_blackwell: "2.7.1"
      index_blackwell: "https://download.pytorch.org/whl/cu128"
    - name: transformers
      version: "4.46.0"
    - name: peft
      version: "0.13.0"
    - name: accelerate
      version: "1.1.0"
    - name: bitsandbytes
      version: "0.44.1"
      # Blackwell 4-bit kernels (sm_120) landed in bitsandbytes 0.45.
      version_blackwell: "0.45.0"
    - name: datasets
      version: "3.0.1"
    - name: sentencepiece
      version: "0.2.0"
    - name: trl
      version: "0.11.4"
  probe: |
    import torch, transformers, peft, accelerate, bitsandbytes, datasets, trl
    assert torch.cuda.is_available(), "torch built without CUDA — wheel install picked the CPU build"
    print(f"torch {torch.__version__} · transformers {transformers.__version__} · peft {peft.__version__}")
    print(f"cuda {torch.version.cuda} · device {torch.cuda.get_device_name(0)}")
    print("OK")

- name: llama-finetune
  display: "Llama / Mistral fine-tuning · auto-CUDA"
  description: >-
    Same toolchain as the Gemma profile, plus flash-attn for the
    longer-context Llama-3 variants. Use this for any LLaMA-family
    base model (Llama-2/3/3.1/3.2, Mistral, Mixtral, Qwen-2.5).
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1"
      cuda_wheel: true
      # Blackwell (RTX 50xx, sm_120) isn't in torch 2.5.1; cu128 + torch 2.7
      # is the first build that supports it. Applied only on a Blackwell GPU.
      version_blackwell: "2.7.1"
      index_blackwell: "https://download.pytorch.org/whl/cu128"
    - name: transformers
      version: "4.46.0"
    - name: peft
      version: "0.13.0"
    - name: accelerate
      version: "1.1.0"
    - name: bitsandbytes
      version: "0.44.1"
      # Blackwell 4-bit kernels (sm_120) landed in bitsandbytes 0.45.
      version_blackwell: "0.45.0"
    - name: datasets
      version: "3.0.1"
    - name: sentencepiece
      version: "0.2.0"
    - name: trl
      version: "0.11.4"
    # flash-attn must build against the exact torch ABI above; the
    # wheel below is the prebuilt one matching torch 2.5 / py3.11. If
    # pip can't find it, fall back to building from source (slow,
    # requires CUDA toolkit).
    - name: flash-attn
      version: "2.7.0.post2"
  probe: |
    import torch, transformers, peft, accelerate, bitsandbytes, datasets, trl
    assert torch.cuda.is_available(), "torch built without CUDA"
    try:
        import flash_attn
        fa_ok = f"flash-attn {flash_attn.__version__}"
    except Exception as e:
        fa_ok = f"flash-attn import failed: {e!r}"
    print(f"torch {torch.__version__} · transformers {transformers.__version__}")
    print(fa_ok)
    print("OK")

- name: unsloth
  display: "Unsloth (fast Llama / Gemma) · auto-CUDA"
  description: >-
    Unsloth-accelerated LoRA training. 2-5× faster than the vanilla
    transformers loop. Linux-first, so on Windows it runs in WSL.
    Pick this for the quickest experimentation cycle.
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1"
      cuda_wheel: true
      # Blackwell (RTX 50xx, sm_120) isn't in torch 2.5.1; cu128 + torch 2.7
      # is the first build that supports it. Applied only on a Blackwell GPU.
      version_blackwell: "2.7.1"
      index_blackwell: "https://download.pytorch.org/whl/cu128"
    - name: unsloth
      version: "2024.11.10"
    - name: peft
      version: "0.13.0"
    - name: datasets
      version: "3.0.1"
    - name: trl
      version: "0.11.4"
  probe: |
    import unsloth, torch
    assert torch.cuda.is_available(), "torch built without CUDA"
    print(f"unsloth {unsloth.__version__} · torch {torch.__version__}")
    print("OK")
