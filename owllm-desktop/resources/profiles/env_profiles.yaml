# env_profiles — declarative Python environment manifests for the
# fine-tuning page. Each top-level dict is one environment the user
# can install via the Train page's "Environment" picker.
#
# Pinning rules:
#   * Every package needs an exact version (== X.Y.Z). No floating
#     ranges — installs must be reproducible.
#   * Use `index_url:` for packages that don't live on PyPI (PyTorch
#     CUDA wheels in particular).
#   * Order matters — pip installs in declaration order so a
#     specific-index `torch` lands before any transformers transitive
#     would otherwise pull a CPU build.
#   * `probe:` must print "OK\n" on success. The probe stdout is
#     surfaced verbatim to the user on failure, so write helpful
#     error messages.
#
# To add a new profile (e.g. CUDA 12.4): append a new entry, commit,
# push. The app fetches this file from GitHub Raw on launch (cached
# 24 h) so users see new envs without reinstalling the app.

- name: gemma-finetune-cu121
  display: "Gemma fine-tuning · CUDA 12.1"
  description: >-
    Compatible with Gemma 2 / 2B / 9B base models on RTX 30xx / 40xx
    GPUs. Uses peft + transformers for LoRA training, bitsandbytes
    for 4-bit quantised loading.
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1+cu121"
      index_url: "https://download.pytorch.org/whl/cu121"
    - name: transformers
      version: "4.46.0"
    - name: peft
      version: "0.13.0"
    - name: accelerate
      version: "1.1.0"
    - name: bitsandbytes
      version: "0.44.1"
    - name: datasets
      version: "3.0.1"
    - name: sentencepiece
      version: "0.2.0"
    - name: trl
      version: "0.11.4"
  probe: |
    import torch, transformers, peft, accelerate, bitsandbytes, datasets, trl
    assert torch.cuda.is_available(), "torch built without CUDA — wheel install picked the CPU build"
    print(f"torch {torch.__version__} · transformers {transformers.__version__} · peft {peft.__version__}")
    print(f"cuda {torch.version.cuda} · device {torch.cuda.get_device_name(0)}")
    print("OK")

- name: llama-finetune-cu121
  display: "Llama / Mistral fine-tuning · CUDA 12.1"
  description: >-
    Same toolchain as the Gemma profile, plus flash-attn for the
    longer-context Llama-3 variants. Use this for any LLaMA-family
    base model (Llama-2/3/3.1/3.2, Mistral, Mixtral, Qwen-2.5).
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1+cu121"
      index_url: "https://download.pytorch.org/whl/cu121"
    - name: transformers
      version: "4.46.0"
    - name: peft
      version: "0.13.0"
    - name: accelerate
      version: "1.1.0"
    - name: bitsandbytes
      version: "0.44.1"
    - name: datasets
      version: "3.0.1"
    - name: sentencepiece
      version: "0.2.0"
    - name: trl
      version: "0.11.4"
    # flash-attn must build against the exact torch ABI above; the
    # wheel below is the prebuilt one matching torch 2.5 / cu121 /
    # py3.11. If pip can't find it, fall back to building from
    # source (slow, requires CUDA toolkit).
    - name: flash-attn
      version: "2.7.0.post2"
  probe: |
    import torch, transformers, peft, accelerate, bitsandbytes, datasets, trl
    assert torch.cuda.is_available(), "torch built without CUDA"
    try:
        import flash_attn
        fa_ok = f"flash-attn {flash_attn.__version__}"
    except Exception as e:
        fa_ok = f"flash-attn import failed: {e!r}"
    print(f"torch {torch.__version__} · transformers {transformers.__version__}")
    print(fa_ok)
    print("OK")

- name: unsloth-cu121
  display: "Unsloth (fast Llama / Gemma) · CUDA 12.1"
  description: >-
    Unsloth-accelerated LoRA training. 2-5× faster than the vanilla
    transformers loop at the cost of pinning specific torch + cuda
    combos. Pick this for the quickest experimentation cycle.
  python: "3.11"
  packages:
    - name: torch
      version: "2.5.1+cu121"
      index_url: "https://download.pytorch.org/whl/cu121"
    - name: unsloth
      version: "2024.11.10"
    - name: peft
      version: "0.13.0"
    - name: datasets
      version: "3.0.1"
    - name: trl
      version: "0.11.4"
  probe: |
    import unsloth, torch
    assert torch.cuda.is_available(), "torch built without CUDA"
    print(f"unsloth {unsloth.__version__} · torch {torch.__version__}")
    print("OK")
