[package]
name = "owllm-desktop"
# Kept in sync with tauri.conf.json "version" (the release source of truth).
# User-visible version strings read crate::APP_VERSION (parsed from the conf),
# so this only affects exe/crate metadata.
version = "0.8.41"
description = "OwLLM Desktop — Tauri + React. Rust owns the runtime; Python is invited on-demand only for fine-tuning."
authors = ["OWLLM"]
edition = "2021"

[lib]
name = "owllm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Runtime dependencies — kept deliberately small. NO reqwest / HTTP
# client (was only used to talk to the deleted python_engine server).
# tokio "process" feature stays — future native llama.cpp spawn will
# use it with CREATE_NO_WINDOW.
[dependencies]
# macos-private-api unlocks WebviewWindowBuilder::transparent() on
# macOS — without it Tauri 2 rejects the call at compile time and only
# Windows/Linux can use transparent windows. The HybridFrame cutaway
# (decorations:false + transparent:true + cyan corners) is non-negotiable
# on every OS, so we opt in to the private-API feature. Caveat: apps
# distributed via the Mac App Store cannot use private APIs; this is a
# non-issue for OwLLM since we ship via .dmg, not the App Store.
tauri = { version = "2.11", features = ["macos-private-api"] }
# Shell auto-update — checks a signed endpoint, downloads delta, swaps
# the binary on next launch. See data/modules/SCHEMA.md "update flow"
# for how this complements per-module updates.
tauri-plugin-updater = "2"
# Native confirmation dialog for the "Update available — Install now?"
# prompt the React side fires when tauri-plugin-updater reports a new
# version. Without this Rust counterpart the JS dialog API throws.
tauri-plugin-dialog = "2"
# Sane process management for the updater's "restart after install"
# step. Tauri-plugin-updater spawns a child detached from us, but on
# Windows the parent (us) needs to exit cleanly so the new binary can
# take over the install dir. tauri-plugin-process exposes exit().
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
thiserror = "1"
# Cross-platform CPU/RAM probe. GPU detection still goes via the
# Windows-specific wmic shell-out below (no NVML dep yet).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Read the legacy LLM/data/owllm_state.db for project listing (agentic
# tab). `bundled` ships the SQLite C lib so we don't depend on an
# externally installed sqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native folder/file picker for the LocationRow's Browse… button. The
# tauri-plugin-dialog setup is heavier (needs JS-side init + permission
# config); rfd is a direct, no-plugin path that opens the system's
# folder dialog on the same UI thread we already own.
rfd = "0.15"
# HTTP client for outbound calls to services that don't speak CORS
# (Telegram Bot API in particular — fetch() from the webview gets
# blocked because api.telegram.org doesn't send the relevant headers).
# rustls-tls so we don't need OpenSSL on the build host. blocking
# feature so the Tauri commands can stay synchronous-flavoured under
# tokio's async runtime without ping-ponging through spawn_blocking.
# `stream` feature unlocks Response::bytes_stream() — needed by the
# huggingface::hf_download streaming progress emitter.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Used by telegram::telegram_download_file to base64-encode media bytes
# for the JS-side Attachment carrier. No-default-features keeps the dep
# lean (we don't need the alloc/std features for this single helper).
base64 = "0.22"
# Email bridge: IMAP receive + SMTP send. native-tls here resolves to schannel
# on Windows (a system lib — no OpenSSL on the build host, consistent with the
# rustls choice above). mailparse pulls the plain-text body out of the fetched
# MIME message; lettre sends replies over SMTP.
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
# Tiny blocking HTTP server for the inbound webhook bridges (WhatsApp / LINE /
# KakaoTalk). default-features=false drops its optional TLS — the public URL is
# provided by the user's tunnel (cloudflared/ngrok), which terminates TLS, so
# the local listener is plain HTTP.
tiny_http = { version = "0.12", default-features = false }
# URL-encode HF model ids before stitching them into REST paths so
# names like "TheBloke/Llama-2-7B-GGUF" survive the round-trip (the
# slash needs to stay as a slash for the route, but anything else
# gets encoded). Tiny, no deps of its own.
urlencoding = "2"
# Stream combinator for reqwest::Response::bytes_stream() —
# `while let Some(chunk) = stream.next().await` needs StreamExt.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# ISO-8601 timestamps for list_tuned_adapters() and env_manager state.
# default-features=false drops the deprecated `time` integration to
# keep the dep slim; "clock" is what we need for DateTime::from_timestamp.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# YAML for env_profiles.yaml — the env-install manifest the app fetches
# from the repo + caches locally. JSON would work too but YAML is more
# readable for the hand-curated profile list.
serde_yaml = "0.9"
# Hash env profile sources so we can detect manifest changes and
# trigger reinstalls atomically. SHA-256 is overkill for a 20-line
# YAML but it's the same hash the rest of the app uses elsewhere.
sha2 = "0.10"
# PNG encoder for The Watcher's window capture (support.rs). Pure Rust,
# encode-only use; BMP-over-IPC would be ~6 MB per shot, PNG is ~10×
# smaller and renders directly in an <img> data URL preview.
png = "0.17"
# Cross-platform pseudo-terminal for the in-app CLI terminal that
# replaces the pop-out CMD window during subscription-CLI login.
# Uses ConPTY on Windows 10+/11 (no extra dep) and forkpty on Unix.
portable-pty = "0.8"
# UUID for PTY session ids — each spawn returns a session id the
# React side passes back on write/resize/kill.
uuid = { version = "1", features = ["v4"] }
# Lock-free singleton for the PTY session map shared between commands.
once_cell = "1"
# Regex engine for the grep/glob agent tools (Claude Code parity).
# default-features OFF drops unicode-segmentation tables we don't need
# for filename + line matching, keeping the dep slim.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
# ZIP archive reader for the in-app uv runtime installer — uv ships
# its Windows release as github.com/astral-sh/uv/releases/.../*.zip,
# we extract uvx.exe + uv.exe into LLM/runtime/uv/ so users don't
# have to touch PowerShell to enable Python-based MCP servers.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# Pure-Rust PDF text extraction for the Dataset Builder, so PDFs work for
# EVERYONE with no Python 'pypdf' to install — the text is extracted in Rust
# (compiled in) and injected into the ingest. Scanned/image-only PDFs have no
# text layer and surface a clear per-source error (no OCR).
pdf-extract = "0.7"
# Pure-Rust audio decoder: turns the user's mp3/m4a/ogg/wav/etc into
# raw PCM samples without spawning ffmpeg. Supports the formats the
# Telegram bot + WhatsApp + in-app uploader will realistically deliver.
# The symphonia core doesn't include opus, but `symphonia-codec-opus`
# is the official sister crate — needed for Telegram voice, which
# ships as opus-in-ogg.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "flac"] }
# Opus decoder wrapper for symphonia — needed because the core
# symphonia crate doesn't include opus and Telegram voice messages
# arrive as opus-in-ogg. Wraps libopus C code (vendored by audiopus-sys
# under the hood), which compiles fine on every Tauri target.
symphonia-adapter-libopus = "0.1"
# OWLLM Node (kvm.rs) — the NanoKVM web login scrambles the password exactly
# like the device's own web client: AES-256-CBC in OpenSSL "Salted__" form with
# the key/iv derived by EVP_BytesToKey(MD5) from a fixed passphrase. These three
# pure-Rust RustCrypto crates reproduce that on every Tauri target (no OpenSSL /
# system dep). The TLS for the realtime HID websocket reuses `native-tls` above.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
# Agent-browser credential IMPORT (browser_import.rs). Chrome/Edge/Brave/Opera
# all share Chromium's "v10" password scheme: a per-profile AES-256 key stored
# in `Local State` (DPAPI-wrapped on Windows), then each password blob is
# AES-256-GCM (12-byte nonce, 16-byte tag). aes-gcm is the pure-Rust RustCrypto
# AEAD for that. `url` (already in the tree via tauri) is named directly here
# and in browser_vault.rs for origin normalisation.
aes-gcm = "0.10"
url = "2"
# OwLLM Remote Devices / Fleet Control (remote_devices/) — cryptographic device
# identity + end-to-end sealed command envelopes. The device keypair IS the
# permission credential: a matching GitHub account alone can NEVER control a
# machine. Ed25519 signs every request (identity + un-forgeable authorship);
# X25519 does the ECDH so a future relay only ever forwards ciphertext (the
# body is AES-256-GCM sealed with `aes-gcm` above, key = SHA-256 of the shared
# secret via `sha2`). `rand`'s OsRng seeds both keygen and the GCM/replay
# nonces. All pure-Rust dalek/RustCrypto crates — no system dep, every target.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

# Windows-only: needed by overlay_frame to make the cyan chrome window
# an "owned" window of main via SetWindowLongPtrW(GWLP_HWNDPARENT).
# Owned windows z-order above their owner but drop behind other apps
# when the owner loses focus — exactly the behaviour we want for a
# decorative frame (must hover above the React content, must NOT hover
# above the user's browser when they alt-tab away). Single function
# call, no need for the heavier `windows` crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # DPAPI (CryptProtectData/Unprotect) for at-rest encryption of the WSL
    # password, tied to the Windows user account. LocalFree (in
    # Win32_Foundation) frees the blob DPAPI allocates.
    "Win32_Security_Cryptography",
    # GDI window capture for The Watcher's bug-report screenshot
    # (support.rs: PrintWindow + DIB readback of the app window — catches
    # in-app modals because they live in the same webview surface).
    # PrintWindow itself lives under Storage_Xps in windows-sys.
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    # DwmSetWindowAttribute — paint the agent-browser window's native title
    # bar / border in the app's chrome colour (browser.rs::apply_chrome).
    "Win32_Graphics_Dwm",
    # GetShortPathNameW — collapse a spaced path (…\OwLLM Desktop\…) to its 8.3
    # form so the `--mcp-config` arg survives the Claude CLI batch-shim spawn
    # (Rust Command → cmd.exe → claude.cmd → node), which splits on the space
    # even when quoted and drops the browser gateway. See mcp_gateway::cli_safe_path.
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

# Release profile: use Cargo defaults (opt-level=3, codegen-units=16)
# plus LTO for the smallest, fastest binary. The previous override
# (opt-level=2, codegen-units=256, lto=false) existed only to dodge
# GNU rustc heap-corruption on the local machine — on the MSVC CI
# toolchain it pessimized the binary so much that Tauri startup grew
# from <1s to ~2s with a visible WebView2 white flash. We don't build
# GNU anymore, so let the optimizer do its job.
[profile.release]
lto = "thin"
strip = "debuginfo"
