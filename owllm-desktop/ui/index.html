<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWLLM — Agentic Team</title>
  </head>
  <body style="margin:0;background:transparent;">
    <!-- Startup cover: the instant the HTML parses, this splash fills the
         viewport with the app's dark canvas color. When ReactDOM renders,
         it replaces #root's children, so the splash naturally disappears
         the moment the React tree mounts. All platforms ship an OPAQUE
         window (Linux went opaque with the Jetson stale-pixel fix — see
         AppShell's opaque-Linux comment), so the dark cover is correct
         everywhere. -->
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;background:#06080d;"></div>
    </div>
    <script>
      // Runs synchronously at parse, before the first paint (mirrors the
      // overlay-frame.html inline-accent seed). WebView2 (Windows) and WKWebView
      // (macOS) never report "Linux"; only webkit2gtk on Linux does.
      try {
        if (navigator.userAgent.indexOf("Linux") !== -1) {
          document.getElementById("boot-splash").style.background = "transparent";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
