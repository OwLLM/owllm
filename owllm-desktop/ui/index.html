<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWLLM — Agentic Team</title>
  </head>
  <body style="margin:0;background:transparent;">
    <!-- Startup cover: the instant the HTML parses, this splash fills the
         viewport with the app's dark canvas color. When ReactDOM renders,
         it replaces #root's children, so the splash naturally disappears
         the moment the React tree mounts.

         Windows/macOS ship an OPAQUE window (tauri.conf.json transparent:false)
         so the dark cover is correct — it masks the overlay-frame flash until
         React paints. Linux ships a TRANSPARENT window (tauri.linux.conf.json
         transparent:true) with the frame drawn in-page: an opaque cover paints
         over the see-through margins and produces the "solid at start → flips to
         transparent" flicker. So on Linux we make the cover transparent at parse
         time, before first paint, so the very first frame is already see-through. -->
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;background:#06080d;"></div>
    </div>
    <script>
      // Runs synchronously at parse, before the first paint (mirrors the
      // overlay-frame.html inline-accent seed). WebView2 (Windows) and WKWebView
      // (macOS) never report "Linux"; only webkit2gtk on Linux does.
      try {
        if (navigator.userAgent.indexOf("Linux") !== -1) {
          document.getElementById("boot-splash").style.background = "transparent";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
