<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWLLM — Agentic Team</title>
  </head>
  <body style="margin:0;background:transparent;">
    <!-- Startup cover: the instant the HTML parses, this splash fills the
         viewport with the app's canvas color. When ReactDOM renders, it
         replaces #root's children, so the splash naturally disappears the
         moment the React tree mounts. All platforms ship an OPAQUE window
         (Linux went opaque with the Jetson stale-pixel fix — see AppShell's
         opaque-Linux comment), so an opaque cover is correct everywhere.

         The colour MUST track --bg-panel, not a literal: every shell variant
         (OverlayContentPanel, LinuxMainContent, HybridFrame's content pane)
         paints var(--bg-panel) as the app canvas, and that token depends on
         BOTH the mode and the accent. A hardcoded dark hex matched no theme —
         resolved against the real stylesheet, light/indigo is
         srgb(0.928 0.939 0.990) (near-white), so a light-mode user's first
         visible frame was near-black and then flipped; even dark/indigo is
         srgb(0.141 0.174 0.297), a visibly lighter navy. bootstrapTheme()
         sets data-theme + --accent before the first paint, so the var
         resolves by then; the literal is only the pre-theme fallback, and
         the window is still hidden at that point. -->
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;background:var(--bg-panel, #06080d);"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
