<!doctype html>
<!-- Chrome bar of the agent browser (browser.rs). Lives as the TOP webview of
     the frameless multi-webview browser window, above the page webview — so
     the browser looks like OwLLM, not a stock OS window, and this bar never
     covers website content. App-origin: shares localStorage with the main UI,
     so it reads the same theme/accent keys the app writes.
     Two rows, like a normal browser: an IDENTITY STRIP that leads with the
     app icon + OwLLM title, then the open site's REAL logo + name at a size
     the user recognises at a glance (WhatsApp/Gmail/Drive), then one pill per
     open page + New tab. EVERY mark in this bar is the same size — the OwLLM
     logo, the open page, and each page in the strip whether or not it is the
     one on screen, so an unopened page is exactly as recognisable (user spec
     2026-07-29). That strip is 30px taller than a plain tab bar so the
     site mark reads as the page's identity, not decoration. Under it, a THIN NAV BAR carries back/reload/URL only —
     browser.rs CHROME_H must match the sum of both. The bar background follows
     the app header's --bg-header recipe (70% accent over #1c2244 navy —
     theme.ts resolveHeaderHex) so both headers match.
     Rust link: NO IPC — buttons/drag/URL entry request a reserved same-origin
     navigation that Rust intercepts and cancels before any document load.
     Rust pushes page
     url/title back by eval'ing window.__owllmChromeSet(...) and the live tab
     list via window.__owllmTabsSet(...). -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>OwLLM Browser Chrome</title>
    <style>
      :root {
        --bg: #5b62a9;          /* replaced live by the header recipe below */
        --bg-nav: rgba(0,0,0,0.22);
        --bg-input: rgba(0,0,0,0.30);
        --fg: #ffffff;
        --fg-muted: rgba(255,255,255,0.72);
        --border: rgba(255,255,255,0.18);
        --accent: #667eea;
      }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: var(--bg); user-select: none;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      /* The chrome webview spans the entire native window so it can paint the
         same solid edge as the main app. Controls still occupy only CHROME_H. */
      #rows { display: flex; flex-direction: column; height: 96px; }
      #windowFrame {
        position: fixed; inset: 0; z-index: 1000;
        border: 3px solid var(--accent); box-sizing: border-box;
        pointer-events: none;
      }
      /* The identity row is 30px taller than a plain tab bar so the open
         page's real logo reads as the page's identity, not a decoration
         alongside a URL (user spec 2026-07-29). */
      #tabsrow {
        display: flex; align-items: center; gap: 8px;
        height: 58px; flex: none; padding: 0 6px 0 10px; box-sizing: border-box;
      }
      #navrow {
        display: flex; align-items: center; gap: 6px;
        flex: 1; padding: 0 8px; box-sizing: border-box;
        background: var(--bg-nav);
        border-bottom: 1px solid var(--border);
      }
      /* ONE mark size everywhere in this bar — the OwLLM logo, the open page's
         identity, and every page in the strip whether it is open or not (user
         spec 2026-07-29). A page you are not looking at is exactly as easy to
         recognise as the one you are. */
      :root { --mark: 46px; --glyph: 32px; }
      /* Site identity — the open page's own logo, big enough to recognise
         without reading the URL. Lives INSIDE the identity row so the tall
         header carries the mark itself, rather than pushing it to a
         separate row below. Width is FIXED: a name-length change used to
         reflow the whole strip sideways under the user's cursor. */
      #site {
        flex: none; display: flex; align-items: center; gap: 10px;
        width: 250px; min-width: 0; padding: 0 6px 0 4px; box-sizing: border-box;
      }
      .mark {
        flex: none; display: flex; align-items: center; justify-content: center;
        width: var(--mark); height: var(--mark); border-radius: 12px;
        background: rgba(255,255,255,0.94);
        box-shadow: 0 2px 6px rgba(0,0,0,0.28);
        overflow: hidden;
      }
      .mark svg, .mark img { width: var(--glyph); height: var(--glyph); display: block; }
      /* Lettermark fallback: brand colour fills the tile, initial on top. */
      .mark.letter { color: #fff; font-size: 26px; font-weight: 800; }
      /* Brands whose standard mark is a white glyph in a coloured disc. */
      .mark.solid { border-radius: 50%; }
      #sitename {
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--fg); font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
      }
      .btn {
        flex: none; display: flex; align-items: center; justify-content: center;
        width: 30px; height: 26px; border-radius: 6px; border: none;
        background: transparent; color: var(--fg-muted); font-size: 13px;
        cursor: pointer; padding: 0;
      }
      .btn:hover { background: rgba(255,255,255,0.14); color: var(--fg); }
      #close:hover { background: #e81123; color: #fff; }
      /* The app's own logo is one of the marks, at the same size as the pages. */
      #logo {
        flex: none; width: var(--mark); height: var(--mark); margin-right: 6px;
        border-radius: 12px;
      }
      #ttl {
        flex: none; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: var(--fg); font-size: 12px; font-weight: 700;
      }
      #tabs {
        display: flex; align-items: center; gap: 6px; margin: 0 4px;
        min-width: 0; overflow: hidden; flex: 0 1 auto;
      }
      /* One pill per page. The mark inside never shrinks — when the strip runs
         out of room the pills drop their title text, not their identity. */
      .tab {
        position: relative; flex: none;
        display: flex; align-items: center;
        height: var(--mark); border-radius: 12px; border: none;
        padding: 0; background: transparent; color: var(--fg-muted);
        font-size: 11px; cursor: pointer; opacity: 0.72;
      }
      .tab.active { opacity: 1; color: var(--fg); font-weight: 700; }
      .tab.active .mark { box-shadow: 0 0 0 2px var(--fg), 0 2px 6px rgba(0,0,0,0.28); }
      .tab:hover { opacity: 1; }
      /* Close sits on the mark's corner so a pill stays exactly one mark wide. */
      .tab .tx {
        position: absolute; top: -3px; right: -3px;
        display: flex; align-items: center; justify-content: center;
        width: 16px; height: 16px; border: none; border-radius: 50%;
        background: var(--bg); color: var(--fg); font-size: 9px;
        cursor: pointer; padding: 0; box-shadow: 0 0 0 1px var(--border);
      }
      .tab .tx:hover { background: #e81123; color: #fff; }
      #newtab, #reopen {
        flex: none; width: 28px; height: 28px; border: none; border-radius: 8px;
        background: transparent; color: var(--fg-muted); font-size: 16px; cursor: pointer; padding: 0;
      }
      #newtab:hover, #reopen:hover { background: rgba(255,255,255,0.14); color: var(--fg); }
      #url {
        flex: 1; min-width: 60px; height: 24px; border-radius: 999px;
        border: 1px solid var(--border); background: var(--bg-input);
        color: var(--fg); font-size: 12px; padding: 0 12px; outline: none;
      }
      #url::placeholder { color: var(--fg-muted); }
      #url:focus { border-color: rgba(255,255,255,0.55); }
      #drag { flex: 1; height: 100%; min-width: 10px; }
      .winbtns { display: flex; gap: 2px; margin-left: 4px; }
    </style>
  </head>
  <body>
    <div id="windowFrame" aria-hidden="true"></div>
    <div id="rows">
      <div id="tabsrow">
        <img id="logo" src="app-icon.png" alt="" />
        <span id="ttl">OwLLM Browser</span>
        <div id="site"><span id="sitemark" class="mark"></span><span id="sitename"></span></div>
        <div id="tabs"></div>
        <button id="newtab" title="New tab">+</button>
        <button id="reopen" title="Reopen closed tab">↺</button>
        <div id="drag"></div>
        <div class="winbtns">
          <button class="btn" id="min" title="Minimize">─</button>
          <button class="btn" id="max" title="Maximize">▢</button>
          <button class="btn" id="close" title="Close">✕</button>
        </div>
      </div>
      <div id="navrow">
        <button class="btn" id="back" title="Back">←</button>
        <button class="btn" id="reload" title="Reload">⟳</button>
        <input id="url" spellcheck="false" placeholder="Enter a URL and press Enter" />
      </div>
    </div>
    <script>
      var eventSeq = 0;
      // Event → Rust: request a reserved same-origin URL. The native chrome
      // navigation handler extracts the payload and returns false, so this
      // document never leaves the toolbar and no network request is made.
      // A nonce guarantees repeated clicks still request distinct URLs.
      function evt(action, data) {
        var b64 = "";
        try { b64 = btoa(unescape(encodeURIComponent(String(data == null ? "" : data)))); } catch (e) {}
        var target = new URL("/__owllm_browser_event__", window.location.href);
        target.searchParams.set("action", action);
        target.searchParams.set("data", b64);
        target.searchParams.set("nonce", String(++eventSeq));
        window.location.assign(target.href);
      }
      var $ = function (id) { return document.getElementById(id); };
      $("min").addEventListener("click", function () { evt("minimize"); });
      $("max").addEventListener("click", function () { evt("maximize"); });
      $("close").addEventListener("click", function () { evt("close"); });
      $("back").addEventListener("click", function () { evt("back"); });
      $("reload").addEventListener("click", function () { evt("reload"); });
      $("newtab").addEventListener("click", function () { evt("tabnew"); });
      $("reopen").addEventListener("click", function () { evt("tabreopen"); });
      $("url").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && this.value.trim()) { evt("nav", this.value.trim()); this.blur(); }
      });
      // Ctrl/Cmd+Shift+T is the undo every browser has trained the user to
      // reach for. Only the chrome has focus-independent key handling here;
      // the ↺ button is the same action for anyone who never learned it.
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "T" || e.key === "t")) {
          e.preventDefault();
          evt("tabreopen");
        }
      });
      // Anywhere that isn't a control starts a window drag; double-click
      // toggles maximize (Rust decides which, we just report).
      function draggy(el) {
        el.addEventListener("mousedown", function (e) { if (e.button === 0) evt("drag"); });
        el.addEventListener("dblclick", function () { evt("maximize"); });
      }
