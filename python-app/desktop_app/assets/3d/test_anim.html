
<!DOCTYPE html>
<html>
<head>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
</head>
<body>
<script>
function norm(s) {
    return String(s || "").trim().toLowerCase();
}
function pickClip(clips, candidates) {
    const names = candidates.map(norm);
    return clips.find((clip) => names.some((name) => norm(clip.name).includes(name))) || null;
}

const loader = new THREE.GLTFLoader();
loader.load('models/Julio_Cesar.glb', (gltf) => {
    const clips = gltf.animations || [];
    console.log("Loaded clips: " + clips.map(c => c.name).join(", "));
    
    const idleClip = pickClip(clips, ["idle", "standing", "breath", "pose", "agree"]) || clips[0];
    const walkClip = pickClip(clips, ["walk", "jog", "run", "locomotion"]);
    const waveClip = pickClip(clips, ["wave", "greet", "hello", "taunt", "attack", "punch"]);
    
    console.log("Idle matched: " + (idleClip ? idleClip.name : "None"));
    console.log("Walk matched: " + (walkClip ? walkClip.name : "None"));
    console.log("Wave matched: " + (waveClip ? waveClip.name : "None"));
}, undefined, (err) => {
    console.error("Error loading model: " + err);
});
</script>
</body>
</html>
