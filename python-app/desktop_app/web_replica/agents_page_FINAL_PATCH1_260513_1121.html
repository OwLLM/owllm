function HybridFrame({ children, width, height }) {
  const CORNER = 96, BORDER = 18, BADGE_H = 58;
  const FRAME_LEFT = 19, FRAME_TOP = 116, RIGHT_OVERHANG = 79, BOTTOM_OVERHANG = 19;
  const outerW = width + FRAME_LEFT + RIGHT_OVERHANG;
  const outerH = height + FRAME_TOP + BOTTOM_OVERHANG;
  const fc = "rgba(120, 220, 255, 0.86)";
  const ac = "rgba(120, 220, 255, 0.78)";
  return (
    <div style={{ position: "relative", width: outerW, height: outerH, background: "transparent" }}>
      <div style={{ position: "absolute", left: FRAME_LEFT, top: FRAME_TOP, width, height, background: "#14152a", overflow: "hidden" }}>{children}</div>
      <div style={{ position: "absolute", left: FRAME_LEFT + CORNER/2, width: width - CORNER, top: FRAME_TOP - BORDER/2, height: BORDER, background: `linear-gradient(90deg, ${ac}, ${fc}, ${ac})`, opacity: 0.8 }} />
      <div style={{ position: "absolute", left: FRAME_LEFT + CORNER/2, width: width - CORNER, top: FRAME_TOP + height - BORDER/2, height: BORDER, background: `linear-gradient(90deg, ${ac}, ${fc}, ${ac})`, opacity: 0.8 }} />
      <div style={{ position: "absolute", top: FRAME_TOP + CORNER/2, height: height - CORNER, left: FRAME_LEFT - BORDER/2, width: BORDER, background: `linear-gradient(180deg, ${ac}, ${fc}, ${ac})`, opacity: 0.8 }} />
      <div style={{ position: "absolute", top: FRAME_TOP + CORNER/2, height: height - CORNER, left: FRAME_LEFT + width - BORDER/2, width: BORDER, background: `linear-gradient(180deg, ${ac}, ${fc}, ${ac})`, opacity: 0.8 }} />
      <img src={`${CORNERS}/corner_ul.png`} style={{ position: "absolute", left: FRAME_LEFT - CORNER/2, top: FRAME_TOP - CORNER/2, width: CORNER, height: CORNER, pointerEvents: "none" }} />
      <img src={`${CORNERS}/corner_ur.png`} style={{ position: "absolute", left: FRAME_LEFT + width - CORNER/2, top: FRAME_TOP - CORNER/2, width: CORNER, height: CORNER, pointerEvents: "none" }} />
      <img src={`${CORNERS}/corner_bl.png`} style={{ position: "absolute", left: FRAME_LEFT - CORNER/2, top: FRAME_TOP + height - CORNER/2, width: CORNER, height: CORNER, pointerEvents: "none" }} />

    </div>
  );
}

function TeamCanvas({ width, height }) {
  const w = width, h = height;
  const card_reserve = Math.min(410, w * 0.35);
  const cx = card_reserve + (w - card_reserve) / 2;
  const cy = h / 2;
  const max_radius = Math.max(120, Math.min(w, h * 1.5) * 0.30);
  const inner_offset = 130;
  const step = (max_radius - inner_offset);
  const ring_radius = inner_offset + step;
  const N = 8;
  const arc_span = (Math.PI * 2) * (340 / 360);
  const start_angle = -Math.PI / 2 - arc_span / 2;
  // VLM fix: richer node tiles — each node has an emoji role icon inside the disc.
  const ROLES = [
    { label: "Workshop Writer",  icon: "✍️", color: "#a78bfa" },
    { label: "Onboarded Coder",  icon: "🧑‍💻", color: "#60a5fa" },
    { label: "Backend Server",   icon: "🖥",   color: "#34d399" },
    { label: "UI Designer",      icon: "🎨",    color: "#f472b6" },
    { label: "Backend Hub",      icon: "🔌",    color: "#22d3ee" },
    { label: "Design Critic",    icon: "🔍",    color: "#facc15" },
    { label: "Frontend Coder",   icon: "💻",   color: "#38bdf8" },
    { label: "Workshop Owl",     icon: "🦉",    color: "#fbbf24" },
  ];
  const nodes = [];
  for (let i = 0; i < N; i++) {
    const a = start_angle + (i + 0.5) * arc_span / N;
    nodes.push({ x: cx + ring_radius * Math.cos(a), y: cy + ring_radius * Math.sin(a), ...ROLES[i] });
  }
  const orchestrator_r = 30;
  return (
    <div style={{ position: "relative", width: w, height: h, background: `radial-gradient(ellipse at ${cx}px ${cy}px, rgba(60, 120, 200, 0.20) 0%, rgba(0, 0, 0, 0) 60%), linear-gradient(180deg, #101522 0%, #06080d 100%)`, overflow: "hidden" }}>
      <svg width={w} height={h} style={{ position:"absolute", left:0, top:0 }}>
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(120,180,255,0.6)" />
            <stop offset="60%" stopColor="rgba(120,180,255,0.18)" />
            <stop offset="100%" stopColor="rgba(120,180,255,0)" />
          </radialGradient>
          <radialGradient id="orchHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(255,210,120,0.75)" />
            <stop offset="100%" stopColor="rgba(255,200,100,0)" />
          </radialGradient>
        </defs>
        {/* VLM fix: concentric faint ring backdrop */}
        <circle cx={cx} cy={cy} r={ring_radius + 50} fill="none" stroke="rgba(120,220,255,0.06)" strokeWidth="1" />
        <circle cx={cx} cy={cy} r={ring_radius + 25} fill="none" stroke="rgba(120,220,255,0.08)" strokeWidth="1" />
        <circle cx={cx} cy={cy} r={ring_radius} fill="none" stroke="rgba(120,220,255,0.22)" strokeWidth="1.6" />
        <circle cx={cx} cy={cy} r={ring_radius - 35} fill="none" stroke="rgba(120,220,255,0.08)" strokeWidth="1" />
        {/* spokes */}
        {nodes.map((n,i) => (
          <line key={i} x1={cx} y1={cy} x2={n.x} y2={n.y} stroke="rgba(120,220,255,0.22)" strokeWidth="1.4" strokeDasharray="3,3" />
        ))}
        {/* node halos */}
        {nodes.map((n,i) => (
          <circle key={"h"+i} cx={n.x} cy={n.y} r={36} fill="url(#halo)" />
        ))}
        {/* node discs */}
        {nodes.map((n,i) => (
          <circle key={"d"+i} cx={n.x} cy={n.y} r={24} fill="#1a2240" stroke={n.color} strokeWidth="2" />
        ))}
        {/* orchestrator halo + selected ring (golden glow) */}
        <circle cx={cx} cy={cy} r={orchestrator_r * 2.4} fill="url(#orchHalo)" />
        <circle cx={cx} cy={cy} r={orchestrator_r + 6} fill="none" stroke="rgba(255,210,120,0.65)" strokeWidth="1.5" strokeDasharray="4,3" />
        <circle cx={cx} cy={cy} r={orchestrator_r} fill="#1c2244" stroke="#ffd27a" strokeWidth="2.5" />
      </svg>
      {/* outer-node role-icon glyphs sitting on top of each disc */}
      {nodes.map((n,i) => (
        <div key={"i"+i} style={{ position: "absolute", left: n.x - 18, top: n.y - 18, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, pointerEvents: "none" }}>{n.icon}</div>
      ))}
      {/* Central crest + crown badge (VLM fix: selected agent indicator) */}
      <img src={`${ICONS}/owl_agentic.png`} style={{ position: "absolute", left: cx - orchestrator_r * 0.85, top: cy - orchestrator_r * 0.85, width: orchestrator_r * 1.7, height: orchestrator_r * 1.7, pointerEvents: "none" }} />
      <div style={{ position: "absolute", left: cx - 14, top: cy - orchestrator_r - 20, width: 28, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, pointerEvents: "none", filter: "drop-shadow(0 0 4px rgba(255,210,120,0.8))" }}>👑</div>
      <div style={{ position: "absolute", left: cx - 60, top: cy + orchestrator_r + 6, width: 120, textAlign: "center", fontSize: 10, fontWeight: 700, color: "#ffd27a", letterSpacing: 0.6, textTransform: "uppercase", pointerEvents: "none" }}>Orchestrator</div>
      {/* outer-node labels */}
      {nodes.map((n,i) => (
        <div key={"l"+i} style={{ position: "absolute", left: n.x - 50, top: n.y + 28, width: 100, textAlign: "center", fontSize: 9, color: "#cbd2e0", textTransform: "uppercase", letterSpacing: 0.4, pointerEvents: "none" }}>{n.label}</div>
      ))}
    </div>
  );
}

function OrchestratorPane() {

  // shows only when none is. Default to selected for this static page.
  const selected = true;
  const code = `* peripheral is active.
