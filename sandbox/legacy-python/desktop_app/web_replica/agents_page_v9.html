<!--
  v9: rebuilt against the TRUE post-load reference rather than the
  loading-page reference v1-v8 were chasing. The user pointed out
  the page loads in phases; commit 8f2bdc9 added an
  N-consecutive-match stability detector that confirmed the
  transition (30.27 % drift between checks 2 and 3).

  The actual Agents page is a 3-COLUMN layout, not a single-pane
  agent canvas:

    ┌──────────────────────────────────────────────────────────┐
    │ Title bar / Tab bar / LOCATION row / GOAL bar (full-width)│
    ├──────────────┬───────────────────────────┬───────────────┤
    │  Flow panel  │                           │  Orchestrator │
    │  Super User  │   Compact agent canvas    │  pane (chat / │
    │  card        │   (8 agents elliptical)   │  code output) │
    │              │                           │               │
    └──────────────┴───────────────────────────┴───────────────┘

  v9 builds that structure. Diffing against the TRUE reference, not
  the loading-page one. Expect a much smaller initial gap because
  the silhouettes now match — instead of v8's 65 % (vs TRUE), v9
  should land in the 30-40 % range as a starting point.
-->

// CENTER CANVAS — agents around a compact emblem
function AgentNode({ x, y, cohort }) {
  const stops = cohort === "blue"
    ? { core: "#a8d6ff", mid: "#4d9ae8", edge: "#2854b0" }
    : { core: "#d4baff", mid: "#a070ec", edge: "#583aa5" };
  const gradId = `g-${Math.round(x)}-${Math.round(y)}`;
  return (
    <g>
      <defs>
        <radialGradient id={gradId} cx="40%" cy="35%" r="65%">
          <stop offset="0%"   stopColor={stops.core} />
          <stop offset="60%"  stopColor={stops.mid} />
          <stop offset="100%" stopColor={stops.edge} />
        </radialGradient>
      </defs>
      <circle cx={x} cy={y} r={26} fill={stops.mid} opacity="0.14" />
      <circle cx={x} cy={y} r={20} fill={stops.mid} opacity="0.22" />
      <circle cx={x} cy={y} r={15} fill={`url(#${gradId})`} />
      <circle cx={x} cy={y} r={15} fill="none" stroke="rgba(255,255,255,0.30)" strokeWidth="0.8" />
    </g>
  );
}

function CenterCanvas() {
  // Narrower than v1-v8 — center pane shares horizontal space with
  // the two sidebars now. Width ~720, height ~680.
  const W = 720, H = 680, cx = W / 2, cy = H / 2;
  const Rx = 260, Ry = 230; // Slightly elliptical, matches the reference.

  const positions = AGENTS.map((a, i) => {
    const angle = (-Math.PI / 2) + (i * 2 * Math.PI / AGENTS.length);
    return { ...a, x: cx + Rx * Math.cos(angle), y: cy + Ry * Math.sin(angle) };
  });

  // Compact central emblem with two cyan arcs.
  const ringR = 70;
  const a1 = -65 * Math.PI / 180, a2 = 65 * Math.PI / 180;
  const topArc = `M ${cx + ringR * Math.cos(a1)} ${cy + ringR * Math.sin(a1)} ` +
                 `A ${ringR} ${ringR} 0 0 1 ${cx + ringR * Math.cos(a2)} ${cy + ringR * Math.sin(a2)}`;
  const bottomArc = `M ${cx + ringR * Math.cos(Math.PI - a1)} ${cy + ringR * Math.sin(Math.PI - a1)} ` +
                    `A ${ringR} ${ringR} 0 0 1 ${cx + ringR * Math.cos(Math.PI - a2)} ${cy + ringR * Math.sin(Math.PI - a2)}`;

  return (
    <div className="relative canvas-bg star-bg overflow-hidden flex-1" style={{ height: H }}>
      <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
           className="absolute inset-0">
        {positions.map((a, i) => (
          <line key={`spoke-${i}`} x1={cx} y1={cy} x2={a.x} y2={a.y}
            stroke="rgba(180,200,255,0.13)" strokeWidth="1" strokeDasharray="3 6" />
        ))}
        {positions.map((a, i) => {
          const b = positions[(i + 1) % positions.length];
          return (
            <line key={`r-${i}`} x1={a.x} y1={a.y} x2={b.x} y2={b.y}
              stroke="rgba(180,200,255,0.08)" strokeWidth="1" strokeDasharray="2 8" />
          );
        })}
        <path d={topArc}    fill="none" stroke="var(--accent-cyan)" strokeWidth="2" opacity="0.55" strokeLinecap="round" />
        <path d={bottomArc} fill="none" stroke="var(--accent-cyan)" strokeWidth="2" opacity="0.55" strokeLinecap="round" />
        {/* Smaller central emblem — fits inside the ring arcs. */}
        <image xlinkHref={`${ASSET}/owl_studio_square.png`}
               x={cx - 50} y={cy - 50} width={100} height={100}
               className="owl-pulse" />
        {positions.map(a => <AgentNode key={a.name} {...a} />)}
        {/* Labels inside SVG so they scale with the viewBox. */}
        {positions.map(a => (
          <text key={`t-${a.name}`} x={a.x} y={a.y + 28}
                fontSize="10" fontFamily="Segoe UI, sans-serif"
                fill="rgba(220,225,244,0.85)" textAnchor="middle">
            {a.name}
          </text>
        ))}
      </svg>
      <div className="absolute bottom-2 left-1/2 -translate-x-1/2 text-white/60 text-[10px] font-mono">
        Ready.
      </div>
    </div>
  );
}
